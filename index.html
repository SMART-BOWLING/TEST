      todo.forEach(n => Sheets._store(n, all[n] === undefined ? null : all[n]));\n        } catch (e) {\n            await Promise.all(todo.map(n => Sheets.select(n).catch(() => {})));\n        }\n    },\n    async bootstrap() {\n        const names = [ \"TEAMS\", \"PLAYERS\", \"LOGOS\", \"MAPS\" ];\n        try {\n            const t = localStorage.getItem(\"csports:tournament\");\n            if (t) names.push(`Результати ${t}`);\n        } catch (e) {}\n        await Sheets.prefetch(names);\n    },\n    async post(payload) {\n        Sheets._clear();\n        const res = await fetch(API_URL, {\n            method: \"POST\",\n            headers: {\n                \"Content-Type\": \"text/plain;charset=utf-8\"\n            },\n            body: JSON.stringify({\n                ...payload,\n                sheetId: SHEET_ID\n            })\n        });\n        const json = await res.json();\n        if (!json.success) throw new Error(json.error);\n        return json.data;\n    },\n    upsert: (sheetName, keyMatchValue, rowData) => Sheets.post({\n        operation: \"UPSERT\",\n        sheetName: sheetName,\n        keyColumnIndex: 0,\n        keyMatchValue: keyMatchValue,\n        rowData: rowData\n    }),\n    async upsertMany(sheetName, rows, headers) {\n        try {\n            const r = await Sheets.post({\n                operation: \"UPSERT_MANY\",\n                sheetName: sheetName,\n                keyColumnIndex: 0,\n                rows: rows,\n                headers: headers\n            });\n            if (r && typeof r.updated === \"number\") return r;\n        } catch (e) {\n            if (!/does not exist/i.test(e.message)) throw e;\n        }\n        if (headers) await Sheets.ensureTable(sheetName, headers);\n        for (const row of rows) await Sheets.upsert(sheetName, row[0], row);\n        return {\n            updated: rows.length,\n            inserted: 0\n        };\n    },\n    insert: (sheetName, rows) => Sheets.post({\n        operation: \"INSERT\",\n        sheetName: sheetName,\n        rows: rows\n    }),\n    createTable: (sheetName, headers) => Sheets.post({\n        operation: \"CREATE_TABLE\",\n        sheetName: sheetName,\n        headers: headers\n    }),\n    async ensureTable(sheetName, headers) {\n        try {\n            await Sheets.createTable(sheetName, headers);\n        } catch (e) {\n            if (/already exists/i.test(e.message)) return;\n            try {\n                Sheets._clear();\n                await Sheets.select(sheetName);\n            } catch (e2) {\n                throw e;\n            }\n        }\n    }\n};\n\nif (typeof module !== \"undefined\") module.exports = Sheets;\n<\/script>\n        <script>\nconst MatchParse = function() {\n    function parseData(rawText) {\n        const text = rawText.replace(/\\u00A0/g, \" \").replace(/\\(.*?\\)/g, \" \").replace(/[%]/g, \" \").replace(/:/g, \" \").replace(/[\\r\\n\\t]+/g, \" \").replace(/\\s{2,}/g, \" \").trim();\n        const fmt2 = /(?<name>[A-Za-z0-9_.-]{1,20})\\s+(?<opk>\\d+)\\s+(?<opd>\\d+)\\s+(?<mks>\\d+)\\s+(?<kast>\\d+\\.\\d+)\\s+(?<clutch>\\d+)\\s+(?<k>\\d+)\\s+(?<a>\\d+)\\s+(?<d>\\d+)\\s+(?<adr>\\d+\\.\\d+)(?:\\s+(?<swing>[-+]?\\d+(?:\\.\\d+)?))?\\s+(?<rating>\\d+\\.\\d+)/g;\n        const fmt1 = /(?<name>[A-Za-z0-9_.-]{1,20})\\s+(?<k>\\d+)\\s+(?<a>\\d+)\\s+(?<d>\\d+)\\s+(?<adr>\\d+\\.\\d+)\\s+(?<kast>\\d+\\.\\d+)(?:\\s+(?<swing>[-+]?\\d+(?:\\.\\d+)?))?\\s+(?<rating>\\d+\\.\\d+)/g;\n        let players = [], match;\n        while ((match = fmt2.exec(text)) !== null) players.push({\n            ...match.groups,\n            index: match.index,\n            end: match.index + match[0].length\n        });\n        if (players.length === 0) while ((match = fmt1.exec(text)) !== null) players.push({\n            ...match.groups,\n            index: match.index,\n            end: match.index + match[0].length\n        });\n        let team1Name = \"Team 1\", team2Name = \"Team 2\";\n        const cleanTeam = str => {\n            let name = str.trim();\n            const half = Math.floor(name.length / 2);\n            return half > 0 && name.substring(0, half) === name.substring(half) ? name.substring(0, half) : name;\n        };\n        if (players.length > 0) team1Name = cleanTeam(text.substring(0, players[0].index).split(/Op\\.|K-D|\\bK\\b\\s+\\bA\\b\\s+\\bD\\b/)[0]) || \"Team 1\";\n        if (players.length >= 6) team2Name = cleanTeam(text.substring(players[4].end, players[5].index).split(/Op\\.|K-D|\\bK\\b\\s+\\bA\\b\\s+\\bD\\b/)[0]) || \"Team 2\";\n        const result = {\n            team1Name: team1Name,\n            team2Name: team2Name,\n            team1Players: [],\n            team2Players: []\n        };\n        const formatP = p => ({\n            name: p.name,\n            stats: {\n                k: parseInt(p.k),\n                a: parseInt(p.a),\n                d: parseInt(p.d),\n                adr: parseFloat(p.adr).toFixed(1),\n                kast: parseFloat(p.kast).toFixed(1) + \"%\",\n                rating: parseFloat(p.rating).toFixed(2),\n                opkd: p.opk === undefined ? \"\" : `${p.opk}:${p.opd}`,\n                mks: p.mks === undefined ? \"\" : String(parseInt(p.mks)),\n                clutch: p.clutch === undefined ? \"\" : String(parseInt(p.clutch)),\n                swing: p.swing === undefined ? \"\" : (parseFloat(p.swing) > 0 ? \"+\" : \"\") + parseFloat(p.swing) + \"%\"\n            }\n        });\n        result.team1Players = players.slice(0, 5).map(formatP);\n        result.team2Players = players.slice(5, 10).map(formatP);\n        const empty = () => ({\n            name: \"\",\n            stats: {\n                k: \"0\",\n                a: \"0\",\n                d: \"0\",\n                adr: \"\",\n                kast: \"\",\n                rating: \"\",\n                swing: \"\",\n                kd: \"\",\n                opkd: \"\",\n                mks: \"\",\n                clutch: \"\"\n            }\n        });\n        while (result.team1Players.length < 5) result.team1Players.push(empty());\n        while (result.team2Players.length < 5) result.team2Players.push(empty());\n        return result;\n    }\n    return {\n        parseData: parseData\n    };\n}();\n\nif (typeof module !== \"undefined\") module.exports = MatchParse;\n<\/script>\n        <script>\nconst COLUMNS = [ {\n    key: \"k\",\n    label: \"K\",\n    w: 7,\n    on: true\n}, {\n    key: \"a\",\n    label: \"A\",\n    w: 7,\n    on: true\n}, {\n    key: \"d\",\n    label: \"D\",\n    w: 7,\n    on: true\n}, {\n    key: \"opkd\",\n    label: \"Op.K-D\",\n    w: 14,\n    on: false\n}, {\n    key: \"mks\",\n    label: \"MKs\",\n    w: 10,\n    on: false\n}, {\n    key: \"clutch\",\n    label: \"1vsX\",\n    w: 10,\n    on: false\n}, {\n    key: \"kd\",\n    label: \"K-D\",\n    w: 9,\n    on: false,\n    get: st => Number.isFinite(st.k) && Number.isFinite(st.d) ? (st.k - st.d > 0 ? \"+\" : \"\") + (st.k - st.d) : \"\"\n}, {\n    key: \"adr\",\n    label: \"ADR\",\n    w: 10,\n    on: true\n}, {\n    key: \"kast\",\n    label: \"KAST\",\n    w: 15,\n    on: true\n}, {\n    key: \"swing\",\n    label: \"Swing\",\n    w: 11,\n    on: false\n}, {\n    key: \"rating\",\n    label: \"Rating\",\n    w: 19,\n    on: true\n} ];\n\nconst shownColumns = () => COLUMNS.filter(c => c.on);\n\nfunction loadColumnPrefs() {\n    try {\n        const saved = JSON.parse(localStorage.getItem(\"mapstats_columns\") || \"null\");\n        if (Array.isArray(saved)) COLUMNS.forEach(c => c.on = saved.includes(c.key));\n    } catch (e) {}\n}\n\nfunction renderColumnChecks() {\n    const box = $(\"#columnChecks\").empty();\n    COLUMNS.forEach(c => {\n        const input = $('<input type=\"checkbox\">').prop(\"checked\", c.on);\n        input.on(\"change\", () => {\n            c.on = input.prop(\"checked\");\n            try {\n                localStorage.setItem(\"mapstats_columns\", JSON.stringify(shownColumns().map(x => x.key)));\n            } catch (e) {}\n            renderBoard();\n        });\n        box.append($(\"<label>\").append(input, document.createTextNode(c.label)));\n    });\n}\n\nfunction renderTableHead() {\n    const cols = shownColumns();\n    const total = cols.reduce((s, c) => s + c.w, 0) || 1;\n    const score = cols.length > 9 ? 6 : cols.length > 8 ? 7 : 10;\n    const team = cols.length > 9 ? 19 : cols.length > 7 ? 21 : 26;\n    const room = 100 - score - team;\n    const crowd = cols.length > 9 ? \"many\" : cols.length > 7 ? \"some\" : \"\";\n    if (crowd) $(\"#board\").attr(\"data-cols\", crowd); else $(\"#board\").removeAttr(\"data-cols\");\n    [ 1, 2 ].forEach(n => {\n        const group = $(`#cols${n}`).empty().append(`<col style=\"width:${score}%\">`, `<col style=\"width:${team}%\">`);\n        const head = $(`#head${n}`);\n        head.children().slice(2).remove();\n        cols.forEach(c => {\n            group.append(`<col style=\"width:${(room * c.w / total).toFixed(2)}%\">`);\n            head.append($(\"<th>\").text(c.label));\n        });\n    });\n}\n\nlet tables = {\n    LOGOS: [],\n    MAPS: [],\n    TEAMS: []\n};\n\nlet currentParse = null;\n\n$(document).ready(async function() {\n    loadColumnPrefs();\n    renderColumnChecks();\n    const savedDay = localStorage.getItem(\"mapstats_day\");\n    if (savedDay) {\n        $(\"#dayInput\").val(savedDay);\n    }\n    for (let idx = 1; idx <= 30; idx++) {\n        $(\"#dayInput\").append(`<option value=\"${idx}\">${idx}<\/option>`);\n    }\n    await loadAllSheets();\n    handleUpdate();\n});\n\nasync function loadAllSheets() {\n    showStatus(\"Загрузка баз данных...\", \"info\");\n    try {\n        await Sheets.bootstrap();\n        const [logos, maps, teams] = await Promise.all([ Sheets.select(\"LOGOS\"), Sheets.select(\"MAPS\"), Sheets.select(\"TEAMS\") ]);\n        tables = {\n            LOGOS: logos.slice(1) || [],\n            MAPS: maps.slice(1) || [],\n            TEAMS: teams.slice(1) || []\n        };\n        $(\"#tournamentList\").html(\"\");\n        $(\"#tournamentInput\")[0].value = tables.LOGOS.at(-1)[0];\n        $(\"#logoRightInput\")[0].value = tables.LOGOS.at(-1)[1];\n        tables.LOGOS.reverse().forEach(r => {\n            if (r[0] !== \"CSPORTS_LOGO\") $(\"#tournamentList\").append(`<option value=\"${r[0]}\"><\/option>`);\n        });\n        $(\"#mapInput\").html(\"\");\n        tables.MAPS.forEach(r => $(\"#mapInput\").append(`<option value=\"${r[0]}\">${r[0]}<\/option>`));\n        $(\"#mapInput\").append('<option value=\"TOTAL\">TOTAL (все карты)<\/option>');\n        const csLogo = tables.LOGOS.find(r => r[0] === \"CSPORTS_LOGO\");\n        if (csLogo) $(\"#logoLeft\").attr(\"src\", csLogo[1]);\n        showStatus(\"Базы данных успешно загружены!\", \"success\");\n    } catch (e) {\n        showStatus(\"Ошибка загрузки БД: \" + e.message, \"error\");\n    }\n}\n\n$(document).on(\"input\", \".controls\", () => handleUpdate());\n\n$(\"#dayInput\").on(\"input\", function() {\n    localStorage.setItem(\"mapstats_day\", $(this).val());\n});\n\n$(\"#clearDataBtn\").on(\"click\", function() {\n    $(\"#score1Input\").val(\"\");\n    $(\"#score2Input\").val(\"\");\n    $(\"#inputData\").val(\"\");\n    handleUpdate();\n});\n\n$(\"#tournamentInput\").on(\"input\", function() {\n    const tName = $(this).val().trim();\n    const logoRow = tables.LOGOS.find(r => r[0] === tName);\n    if (logoRow) $(\"#logoRightInput\").val(logoRow[1]);\n});\n\n$(\"#tournamentSelect\").on(\"change\", function() {\n    const val = $(this).val();\n    if (val) {\n        $(\"#tournamentInput\").val(val).trigger(\"input\");\n    }\n});\n\n$(\"#saveTournamentBtn\").on(\"click\", async function() {\n    const id = $(\"#tournamentInput\").val().trim();\n    const url = $(\"#logoRightInput\").val().trim();\n    if (!id) return;\n    $(this).text(\"⏳\");\n    await Sheets.upsert(\"LOGOS\", id, [ id, url ]);\n    $(this).text(\"💾\");\n    showStatus(\"Турнир сохранен!\", \"success\");\n});\n\n$(\"#reloadAllBtn\").on(\"click\", () => {\n    Sheets._clear();\n    loadAllSheets();\n});\n\nasync function handleUpdate() {\n    const rawData = $(\"#inputData\").val().trim();\n    try {\n        localStorage.setItem(\"mapstats_match\", JSON.stringify({\n            paste: rawData,\n            score1: $(\"#score1Input\").val(),\n            score2: $(\"#score2Input\").val(),\n            map: $(\"#mapInput\").val(),\n            tournament: $(\"#tournamentInput\").val(),\n            logo: $(\"#logoRightInput\").val()\n        }));\n    } catch (e) {}\n    if (!rawData) {\n        currentParse = {\n            team1Name: \"Team 1\",\n            team2Name: \"Team 2\",\n            team1Players: [],\n            team2Players: []\n        };\n        const empty = () => ({\n            name: \"\",\n            stats: {\n                k: \"0\",\n                a: \"0\",\n                d: \"0\",\n                adr: \"\",\n                kast: \"\",\n                rating: \"\",\n                swing: \"\",\n                kd: \"\",\n                opkd: \"\",\n                mks: \"\",\n                clutch: \"\"\n            }\n        });\n        while (currentParse.team1Players.length < 5) currentParse.team1Players.push(empty());\n        while (currentParse.team2Players.length < 5) currentParse.team2Players.push(empty());\n        renderBoard();\n        return;\n    }\n    currentParse = MatchParse.parseData(rawData);\n    await enforceTeamModal(currentParse.team1Name);\n    await enforceTeamModal(currentParse.team2Name);\n    renderBoard();\n}\n\nfunction renderBoard() {\n    $(\"#tournamentName\").text($(\"#tournamentInput\").val());\n    $(\"#logoRight\").attr(\"src\", $(\"#logoRightInput\").val());\n    $(\"#score1\").text($(\"#score1Input\").val());\n    $(\"#score2\").text($(\"#score2Input\").val());\n    $(\"#mapName\").text($(\"#mapInput\").val());\n    const mapRow = tables.MAPS.find(r => r[0] === $(\"#mapInput\").val());\n    if (mapRow) {\n        $(\"#mapOverlay\").css(\"background-image\", `url('${mapRow[1]}')`).show();\n    } else {\n        $(\"#mapOverlay\").hide();\n    }\n    renderTableHead();\n    renderTeam(\"team1\", currentParse.team1Name, currentParse.team1Players);\n    renderTeam(\"team2\", currentParse.team2Name, currentParse.team2Players);\n}\n\nfunction renderTeam(prefix, fullName, players) {\n    let tName = fullName, tLogo = \"\";\n    const tRow = tables.TEAMS.find(r => r[0].toLowerCase() === fullName.toLowerCase());\n    if (tRow) {\n        if (tRow[1]) tName = tRow[1];\n        if (tRow[2]) tLogo = tRow[2];\n    }\n    const $header = $(`#${prefix}Header`).empty();\n    const $div = $(\"<div>\").addClass(\"team-cell\");\n    if (tLogo) $div.append($(\"<img>\").attr(\"src\", tLogo).addClass(\"team-logo-img\"));\n    $div.append($(\"<span>\").text(tName));\n    $header.append($div);\n    const $body = $(`#${prefix}Body`).empty();\n    players.forEach(p => {\n        const ratingNum = parseFloat(p.stats.rating);\n        const ratingClass = isNaN(ratingNum) ? \"\" : ratingNum >= 1 ? \"rating-high\" : \"rating-low\";\n        const cells = shownColumns().map(c => {\n            const v = c.get ? c.get(p.stats) : p.stats[c.key];\n            return `<td${c.key === \"rating\" ? ` class=\"${ratingClass}\"` : \"\"}>${v === undefined ? \"\" : v}<\/td>`;\n        }).join(\"\");\n        $body.append(`<tr><td colspan=\"2\" class=\"team-name\"><div class=\"team-cell\"><span>${p.name}<\/span><\/div><\/td>${cells}<\/tr>`);\n    });\n}\n\nasync function enforceTeamModal(teamName) {\n    if (!teamName || teamName === \"Team 1\" || teamName === \"Team 2\") return;\n    if (tables.TEAMS.find(r => r[0].toLowerCase() === teamName.toLowerCase())) return;\n    $(\"#modalTeamNameLabel\").text(teamName);\n    $(\"#teamModal\").css(\"display\", \"flex\");\n    $(\"#saveTeamBtn\").off(\"click\").on(\"click\", async function() {\n        const sName = $(\"#modalShortName\").val(), url = $(\"#modalTeamLogo\").val();\n        await Sheets.upsert(\"TEAMS\", teamName, [ teamName, sName, url ]);\n        tables.TEAMS.push([ teamName, sName, url ]);\n        $(\"#teamModal\").hide();\n        handleUpdate();\n    });\n}\n\n$(\"#saveDbBtn\").on(\"click\", async function() {\n    if (!currentParse) return;\n    const $btn = $(this);\n    const originalText = $btn.text();\n    $btn.text(\"Сохранение...\").prop(\"disabled\", true);\n    const tName = $(\"#tournamentInput\").val(), sheetName = `Результати ${tName}`, day = $(\"#dayInput\").val(), map = $(\"#mapInput\").val(), score1 = $(\"#score1Input\").val(), score2 = $(\"#score2Input\").val(), ts = (new Date).toISOString();\n    try {\n        await Sheets.createTable(sheetName, [ \"Player name\", \"Team name\", \"Opponent team\", \"Day\", \"Map name\", \"Op.K-D\", \"MKs\", \"KAST\", \"1vsX\", \"K (hs)\", \"A (f)\", \"D (t)\", \"ADR\", \"Swing\", \"Rating3.0\", \"Created at\", \"Score\", \"Opp score\" ]);\n    } catch (e) {}\n    const rows = [];\n    currentParse.team1Players.forEach(p => rows.push([ p.name, currentParse.team1Name, currentParse.team2Name, day, map, p.stats.opkd ? \"'\" + p.stats.opkd : \"\", p.stats.mks || \"\", p.stats.kast, p.stats.clutch || \"\", p.stats.k, p.stats.a, p.stats.d, \"'\" + p.stats.adr, \"\", \"'\" + p.stats.rating, ts, score1, score2 ]));\n    currentParse.team2Players.forEach(p => rows.push([ p.name, currentParse.team2Name, currentParse.team1Name, day, map, p.stats.opkd ? \"'\" + p.stats.opkd : \"\", p.stats.mks || \"\", p.stats.kast, p.stats.clutch || \"\", p.stats.k, p.stats.a, p.stats.d, \"'\" + p.stats.adr, \"\", \"'\" + p.stats.rating, ts, score2, score1 ]));\n    try {\n        await Sheets.insert(sheetName, rows);\n        $btn.text(\"Сохранено!\");\n    } catch (e) {\n        $btn.text(\"Ошибка\");\n    } finally {\n        setTimeout(() => {\n            $btn.text(originalText).prop(\"disabled\", false);\n        }, 1500);\n    }\n});\n\nfunction showStatus(msg, type) {\n    const $st = $(\"#statusMessage\").text(msg).removeClass(\"success error info\").addClass(type).show();\n    setTimeout(() => $st.hide(), 5e3);\n}\n\n$(\"#downloadBtn\").on(\"click\", function() {\n    const $btn = $(this).text(\"⏳ Создание...\");\n    html2canvas(document.getElementById(\"board\"), {\n        useCORS: true,\n        scale: 2,\n        backgroundColor: null,\n        onclone: d => d.getElementById(\"board\").style.transform = \"none\"\n    }).then(canvas => {\n        const link = document.createElement(\"a\");\n        link.download = \"mapstats-board.png\";\n        link.href = canvas.toDataURL(\"image/png\");\n        link.click();\n        $btn.text(\"Скачать (PNG)\");\n    });\n});\n\n$(\"#shareBtn\").on(\"click\", async function() {\n    try {\n        const canvas = await html2canvas(document.getElementById(\"board\"), {\n            useCORS: true,\n            scale: 2,\n            backgroundColor: null,\n            onclone: d => d.getElementById(\"board\").style.transform = \"none\"\n        });\n        canvas.toBlob(async blob => {\n            const file = new File([ blob ], \"mapstats.png\", {\n                type: \"image/png\"\n            });\n            if (navigator.canShare && navigator.canShare({\n                files: [ file ]\n            })) {\n                await navigator.share({\n                    files: [ file ]\n                });\n            } else {\n                showStatus(\"Ваш браузер не поддерживает Share API.\", \"error\");\n            }\n        });\n    } catch (e) {\n        showStatus(\"Ошибка при попытке поделиться: \" + e.message, \"error\");\n    }\n});\n\n$(\"#closeModalBtn\").on(\"click\", () => $(\"#teamModal\").hide());\n\nfunction fitMapBoard() {\n    const wrap = document.getElementById(\"boardWrap\");\n    const board = document.getElementById(\"board\");\n    const k = Math.min(1, wrap.clientWidth / 521);\n    board.style.transform = `scale(${k})`;\n    board.style.transformOrigin = \"0 0\";\n    wrap.style.height = board.offsetHeight * k + \"px\";\n}\n\nnew ResizeObserver(fitMapBoard).observe(document.getElementById(\"boardWrap\"));\n\nnew ResizeObserver(fitMapBoard).observe(document.getElementById(\"board\"));\n<\/script>\n    <\/body>\n<\/html>\n",

().replace(/[^A-Z0-9]/g, \"\")] || \"#9a5cf8\";\n\nconst fmtRating = v => String(v).replace(\".\", \",\");\n\nasync function init() {\n    UI.status(\"Загрузка...\");\n    try {\n        await Sheets.bootstrap();\n        state.teams = await Data.loadTeams();\n        state.logoRows = (await Sheets.select(\"LOGOS\")).slice(1);\n        state.maps = (await Sheets.select(\"MAPS\")).slice(1);\n        const names = await Data.loadTournaments();\n        UI.fillSelect($(\"tournament\"), names, Data.pref.get(\"tournament\", \"\"));\n        UI.fillSelect($(\"map\"), state.maps.map(r => r[0]), \"\");\n        loadColumnPrefs();\n        renderColumnChecks();\n        pullFromMaps();\n        onTournament(false);\n    } catch (e) {\n        UI.status(\"Ошибка загрузки: \" + e.message, \"error\");\n    }\n}\n\nfunction pullFromMaps() {\n    try {\n        const m = JSON.parse(localStorage.getItem(\"mapstats_match\") || \"null\");\n        if (!m) return;\n        $(\"paste\").value = m.paste || \"\";\n        $(\"score1\").value = m.score1 || \"\";\n        $(\"score2\").value = m.score2 || \"\";\n        if (m.map) $(\"map\").value = m.map;\n        if (m.tournament && [ ...$(\"tournament\").options ].some(o => o.value === m.tournament)) {\n            $(\"tournament\").value = m.tournament;\n        }\n    } catch (e) {}\n}\n\nfunction onTournament(fillTitles = true) {\n    const t = $(\"tournament\").value;\n    Data.pref.set(\"tournament\", t);\n    const saved = k => Data.pref.get(`alt.${k}:${t}`, null);\n    $(\"titleTop\").value = saved(\"top\") ?? t;\n    $(\"titleBottom\").value = saved(\"bottom\") ?? \"\";\n    refresh();\n}\n\nfunction refresh() {\n    const text = $(\"paste\").value.trim();\n    state.parsed = text ? MatchParse.parseData(text) : null;\n    const names = state.parsed ? [ state.parsed.team1Name, state.parsed.team2Name ] : [];\n    Logos.render($(\"logos\"), names, state.teams, render);\n    render();\n}\n\nlet token = 0;\n\nasync function render() v);\n                if (c.key === \"rating\") {\n                    const good = parseFloat(val) >= 1;\n                    return `<div class=\"pill ${good ? \"good\" : \"bad\"}\" style=\"left:${xs[i] - 40 - 39}px\">${fmtRating(val)}<\/div>`;\n                }\n                return `<div class=\"cell\" style=\"left:${xs[i] - 40 - 50}px\">${val}<\/div>`;\n            }).join(\"\");\n            return `<div class=\"prow ${r % 2 ? \"alt\" : \"\"}\" style=\"top:${80 + r * 55}px\"><div class=\"nick\">${Board.esc(String(p.name).toUpperCase())}<\/div>${cells}<\/div>`;\n        }).join(\"\");\n        const logo = team.square ? `<img class=\"tsq\" src=\"${Board.esc(team.square)}\" crossorigin=\"anonymous\" alt=\"\">` : `<div class=\"tsq fallback\">${team.fallback ? `<img src=\"${Board.esc(team.fallback)}\" crossorigin=\"anonymous\" alt=\"\">` : \"\"}<\/div>`;\n        return `<div class=\"block\" style=\"top:${top}px\"><div class=\"bhead\" style=\"background:${color}\">${head}<\/div>${rows}\\n            <div class=\"score\">${score === \"\" ? \"\" : Board.esc(score)}<\/div>${logo}\\n            <div class=\"tname\">${Board.esc(String(team.short).toUpperCase())}<\/div><\/div>`;\n    };\n    const empty = () => ({\n        name: \"\",\n        stats: {}\n    });\n    const pad = a => [ ...a || [], ...Array(5).fill(empty()) ].slice(0, 5);\n    const p1 = parsed ? parsed.team1Players : [];\n    const p2 = parsed ? parsed.team2Players : [];\n    const top = $(\"titleTop\").value.trim();\n    const bottom = $(\"titleBottom\").value.trim();\n    const squareLogo = tournSquare ? `<img class=\"tl-ready\" src=\"${Board.esc(tournSquare)}\" crossorigin=\"anonymous\" alt=\"\">` : `<div class=\"tl\"><img src=\"${Board.esc(tournLogo)}\" ${tournLogo ? \"\" : 'style=\"display:none\"'} crossorigin=\"anonymous\" alt=\"\"><\/div>`;\n    board.innerHTML = `\\n        <div class=\"bg ${bg ? \"\" : mapName === \"MIRAGE\" ? \"mirage\" : \"plain\"}\" ${bg ? `style=\"background-image:url(${bg})\"` : \"\"}><\/div>\\n        ${squareLogo}\\n        ${top ? `<div class=\"plate\" style=\"top:24px\">${Board.esc(top.toUpperCase())}<\/div>` : \"\"}\\n        ${bottom ? `<div class=\"plate\" style=\"top:97px\">${Board.esc(bottom.toUpperCase())}<\/div>` : \"\"}\\n        ${block(178, $(\"color1\").value, team1, $(\"score1\").value, pad(p1))}\\n        ${block(560, $(\"color2\").value, team2, $(\"score2\").value, pad(p2))}\\n        <div class=\"footer2\">\\n            <div class=\"fp brand\"><\/div>\\n            <div class=\"fp insta\"><\/div>\\n            <div class=\"fp tg\"><\/div>\\n            <div class=\"fp handle\">/CSPORTS_OFFICIAL<\/div>\\n            <div class=\"fp mappill\" style=\"background:${mapColor(mapName)}\">${Board.esc(String(mapName).toUpperCase())}<\/div>\\n        <\/div>`;\n    fit(board);\n}\n\nfunction fit(board) {\n    board.querySelectorAll(\".plate\").forEach(el => {\n        let size = 46.2;\n        el.style.fontSize = size + \"px\";\n        while (el.offsetWidth > 770 && size > 18) {\n            size -= 1;\n            el.style.fontSize = size + \"px\";\n        }\n    });\n    board.querySelectorAll(\".nick\").forEach(el => {\n        let size = 25;\n        el.style.fontSize = size + \"px\";\n        while (el.scrollWidth > 300 && size > 12) {\n            size -= .5;\n            el.style.fontSize = size + \"px\";\n        }\n    });\n    board.querySelectorAll(\".tname\").forEach(el => {\n        let size = 25;\n        el.style.fontSize = size + \"px\";\n        while (el.scrollWidth > 150 && size > 12) {\n            size -= .5;\n            el.style.fontSize = size + \"px\";\n        }\n    });\n}\n\n[ \"titleTop\", \"titleBottom\" ].forEach(id => {\n    $(id).oninput = () => {\n        const t = $(\"tournament\").value;\n        Data.pref.set(`alt.${id === \"titleTop\" ? \"top\" : \"bottom\"}:${t}`, $(id).value);\n        render();\n    };\n});\n\n$(\"tournament\").onchange = () => onTournament(true);\n\n$(\"map\"). er);\n        UI._timer = setTimeout(() => el.style.display = \"none\", 5e3);\n    }\n};\n<\/script>\n        <script>\nconst Logos = {\n    render(container, names, teams, onChange) {\n        container.innerHTML = \"\";\n        [ ...new Set(names) ].forEach(name => {\n            const t = teams.get(name);\n            const box = document.createElement(\"div\");\n            box.className = \"slot\";\n            box.innerHTML = `<span>${Board.esc(t.short)}<\/span>`;\n            const make = (placeholder, value, key) => {\n                const input = document.createElement(\"input\");\n                input.type = \"text\";\n                input.placeholder = placeholder;\n                input.value = value;\n                input.oninput = () => {\n                    teams.set({\n                        ...teams.get(name),\n                        full: t.full,\n                        [key]: input.value.trim()\n                    });\n                    onChange();\n                };\n                return input;\n            };\n            const save = document.createElement(\"button\");\n            save.className = \"secondary-btn\";\n            save.textContent = \"Сохранить логотипы\";\n            save.onclick = async () => {\n                const cur = teams.get(name);\n                if (!confirm(`Записать ссылки на логотипы ${cur.full} в лист TEAMS?`)) return;\n                try {\n                    await teams.ensureHeader();\n                    await Sheets.upsert(\"TEAMS\", cur.full, [ cur.full, cur.short, cur.logo, cur.logoWhite, cur.logoSquare || \"\" ]);\n                    UI.status(\"Сохранено: \" + cur.full, \"success\");\n                } catch (e) {\n                    UI.status(\"Ошибка сохранения: \" + e.message, \"error\");\n                }\n            };\n            box.append(make(\"URL логотипа (цветной)\", t.logo, \"logo\"), make(\"URL логотипа (белый)\", t.logoWhite, \"logoWhite\"), make(\"URL логотипа 1:1     async post(payload) {
        Sheets._clear();
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                ...payload,
                sheetId: SHEET_ID
            })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        return json.data;
    },
    upsert: (sheetName, keyMatchValue, rowData) => Sheets.post({
        operation: "UPSERT",
        sheetName: sheetName,
        keyColumnIndex: 0,
        keyMatchValue: keyMatchValue,
        rowData: rowData
    }),
    async upsertMany(sheetName, rows, headers) {
        try {
            const r = await Sheets.post({
                operation: "UPSERT_MANY",
                sheetName: sheetName,
                keyColumnIndex: 0,
                rows: rows,
                headers: headers
            });
            if (r && typeof r.updated === "number") return r;
        } catch (e) {
            if (!/does not exist/i.test(e.message)) throw e;
        }
        if (headers) await Sheets.ensureTable(sheetName, headers);
        for (const row of rows) await Sheets.upsert(sheetName, row[0], row);
        return {
            updated: rows.length,
            inserted: 0
        };
    },
    insert: (sheetName, rows) => Sheets.post({
        operation: "INSERT",
        sheetName: sheetName,
        rows: rows
    }),
    createTable: (sheetName, headers) => Sheets.post({
        operation: "CREATE_TABLE",
        sheetName: sheetName,
        headers: headers
    }),
    async ensureTable(sheetName, headers) {
        try {
            await Sheets.createTable(sheetName, headers);
        } catch (e) {
            if (/already exists/i.test(e.message)) return;
            try {
                Sheets._clear();
                await Sheets.select(sheetName);
            } catch (e2) {
                throw e;
            }
        }
    }
};

if (typeof module !== "undefined") module.exports = Sheets;
</script>
        <script>
const TABS = window.__TABS__;

const frames = {};

const tabsEl = document.getElementById("tabs");

const framesEl = document.getElementById("frames");

let active = "";

TABS.forEach(([key, title]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = title;
    b.dataset.key = key;
    b.onclick = () => show(key);
    tabsEl.append(b);
});

function fit(frame) {
    const d = frame.contentDocument;
    if (!d || !d.body || !frame.classList.contains("active")) return;
    frame.style.height = d.body.offsetHeight + "px";
}

function follow(frame) {
    const d = frame.contentDocument;
    if (!d || !frame.classList.contains("active")) return;
    const pv = d.querySelector(".preview");
    if (!pv) return;
    if (frame.clientWidth < 1100) {
        pv.style.transform = "";
        return;
    }
    const box = pv.parentElement;
    const natural = box.offsetTop + (pv.offsetTop - box.offsetTop);
    const gone = -frame.getBoundingClientRect().top;
    const room = box.offsetHeight - pv.offsetHeight;
    const y = Math.max(0, Math.min(room, gone + 16 - natural));
    pv.style.transform = y ? `translateY(${y}px)` : "";
}

function watchToast(frame) {
    const d = frame.contentDocument;
    const el = d.getElementById("statusMessage");
    if (!el) return;
    const place = () => {
        if (el.style.display === "none" || !el.style.display) return;
        const top = Math.max(0, -frame.getBoundingClientRect().top) + 10;
        el.style.position = "absolute";
        el.style.left = "50%";
        el.style.transform = "translateX(-50%)";
        el.style.top = top + "px";
        el.style.zIndex = 2e3;
        el.style.margin = "0";
    };
    new MutationObserver(place).observe(el, {
        attributes: true,
        attributeFilter: [ "style", "class" ]
    });
}

function create(key) {
    const f = document.createElement("iframe");
    f.title = key;
    f.setAttribute("allow", "web-share; clipboard-write");
    f.onload = () => {
        const d = f.contentDocument;
        if (!d || !d.body) return;
        new ResizeObserver(() => fit(f)).observe(d.body);
        watchToast(f);
        fit(f);
    };
    f.srcdoc = window.__PAGES__[key];
    framesEl.append(f);
    frames[key] = f;
}

function show(key) {
    if (!frames[key]) create(key);
    active = key;
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle("active", k === key));
    tabsEl.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.key === key));
    try {
        localStorage.setItem("csports:tab", key);
    } catch (e) {}
    history.replaceState(null, "", "#" + key);
    fit(frames[key]);
    follow(frames[key]);
}

window.addEventListener("scroll", () => active && follow(frames[active]), {
    passive: true
});

window.addEventListener("resize", () => {
    if (!active) return;
    fit(frames[active]);
    follow(frames[active]);
});

(async function() {
    framesEl.innerHTML = '<div id="loading">Загрузка...</div>';
    try {
        await Sheets.bootstrap();
    } catch (e) {}
    framesEl.innerHTML = "";
    let key = location.hash.slice(1);
    try {
        key = key || localStorage.getItem("csports:tab") || "";
    } catch (e) {}
    show(TABS.some(([k]) => k === key) ? key : TABS[0][0]);
})();
</script>
