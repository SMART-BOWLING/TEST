hParams.set(k, v));\n        const json = await (await fetch(url)).json();\n        if (!json.success) throw new Error(json.error);\n        return json.data;\n    },\n    async select(sheetName) {\n        const hit = Sheets._cached(sheetName);\n        if (hit) {\n            if (hit.data === null) throw new Error(\"Table does not exist\");\n            return hit.data;\n        }\n        let data;\n        try {\n            data = await Sheets._get({\n                sheetName: sheetName\n            });\n        } catch (e) {\n            if (/does not exist/i.test(e.message)) Sheets._store(sheetName, null);\n            throw e;\n        }\n        Sheets._store(sheetName, data);\n        return data;\n    },\n    async prefetch(names) {\n        const todo = [ ...new Set(names) ].filter(n => !Sheets._cached(n));\n        if (!todo.length) return;\n        try {\n            const all = await Sheets._get({\n                sheetNames: JSON.stringify(todo)\n            });\n            if (!all || typeof all !== \"object\" || Array.isArray(all)) throw new Error(\"no batch\");\n            todo.forEach(n => Sheets._store(n, all[n] === undefined ? null : all[n]));\n        } catch (e) {\n            await Promise.all(todo.map(n => Sheets.select(n).catch(() => {})));\n        }\n    },\n    async bootstrap() {\n        const names = [ \"TEAMS\", \"PLAYERS\", \"LOGOS\", \"MAPS\" ];\n        try {\n            const t = localStorage.getItem(\"csports:tournament\");\n            if (t) names.push(`Результати ${t}`);\n        } catch (e) {}\n        await Sheets.prefetch(names);\n    },\n    async post(payload) {\n        Sheets._clear();\n        const res = await fetch(API_URL, {\n            method: \"POST\",\n            headers: {\n                \"Content-Type\": \"text/plain;charset=utf-8\"\n            },\n            body: JSON.stringify({\n                ...payload,\n                sheetId: SHEET_ID\n            })\n        });\n        const json = awai key: \"d\",\n    label: \"D\",\n    w: 7,\n    on: true\n}, {\n    key: \"kd\",\n    label: \"K-D\",\n    w: 9,\n    on: false,\n    get: st => Number.isFinite(st.k) && Number.isFinite(st.d) ? (st.k - st.d > 0 ? \"+\" : \"\") + (st.k - st.d) : \"\"\n}, {\n    key: \"adr\",\n    label: \"ADR\",\n    w: 10,\n    on: true\n}, {\n    key: \"kast\",\n    label: \"KAST\",\n    w: 15,\n    on: true\n}, {\n    key: \"swing\",\n    label: \"Swing\",\n    w: 11,\n    on: false\n}, {\n    key: \"rating\",\n    label: \"Rating\",\n    w: 19,\n    on: true\n} ];\n\nconst shownColumns = () => COLUMNS.filter(c => c.on);\n\nfunction loadColumnPrefs() {\n    try {\n        const saved = JSON.parse(localStorage.getItem(\"mapstats_columns\") || \"null\");\n        if (Array.isArray(saved)) COLUMNS.forEach(c => c.on = saved.includes(c.key));\n    } catch (e) {}\n}\n\nfunction renderColumnChecks() {\n    const box = $(\"#columnChecks\").empty();\n    COLUMNS.forEach(c => {\n        const input = $('<input type=\"checkbox\">').prop(\"checked\", c.on);\n        input.on(\"change\", () => {\n            c.on = input.prop(\"checked\");\n            try {\n                localStorage.setItem(\"mapstats_columns\", JSON.stringify(shownColumns().map(x => x.key)));\n            } catch (e) {}\n            renderBoard();\n        });\n        box.append($(\"<label>\").append(input, document.createTextNode(c.label)));\n    });\n}\n\nfunction renderTableHead() {\n    const cols = shownColumns();\n    const total = cols.reduce((s, c) => s + c.w, 0) || 1;\n    [ 1, 2 ].forEach(n => {\n        const group = $(`#cols${n}`).empty().append('<col style=\"width:10%\">', '<col style=\"width:26%\">');\n        const head = $(`#head${n}`);\n        head.children().slice(2).remove();\n        cols.forEach(c => {\n            group.append(`<col style=\"width:${(64 * c.w / total).toFixed(2)}%\">`);\n            head.append($(\"<th>\").text(c.label));\n        });\n    });\n}\n\nlet tables = {\n    LOGOS: [],\n    MAPS: [],\n    TEAMS: []\n};\n\nlet currentParse = null;\n\n$(document).ready(async function() {\n    loadColumnPrefs();\n    renderColumnChecks();\n    const savedDay = localStorage.getItem(\"mapstats_day\");\n    if (savedDay) {\n        $(\"#dayInput\").val(savedDay);\n    }\n    for (let idx = 1; idx <= 30; idx++) {\n        $(\"#dayInput\").append(`<option value=\"${idx}\">${idx}<\/option>`);\n    }\n    await loadAllSheets();\n    handleUpdate();\n});\n\nasync function loadAllSheets() {\n    showStatus(\"Загрузка баз данных...\", \"info\");\n    try {\n        await Sheets.bootstrap();\n        const [logos, maps, teams] = await Promise.all([ Sheets.select(\"LOGOS\"), Sheets.select(\"MAPS\"), Sheets.select(\"TEAMS\") ]);\n        tables = {\n            LOGOS: logos.slice(1) || [],\n            MAPS: maps.slice(1) || [],\n            TEAMS: teams.slice(1) || []\n        };\n        $(\"#tournamentList\").html(\"\");\n        $(\"#tournamentInput\")[0].value = tables.LOGOS.at(-1)[0];\n        $(\"#logoRightInput\")[0].value = tables.LOGOS.at(-1)[1];\n        tables.LOGOS.reverse().forEach(r => {\n            if (r[0] !== \"CSPORTS_LOGO\") $(\"#tournamentList\").append(`<option value=\"${r[0]}\"><\/option>`);\n        });\n        $(\"#mapInput\").html(\"\");\n        tables.MAPS.forEach(r => $(\"#mapInput\").append(`<option value=\"${r[0]}\">${r[0]}<\/option>`));\n        $(\"#mapInput\").append('<option value=\"TOTAL\">TOTAL (все карты)<\/option>');\n        const csLogo = tables.LOGOS.find(r => r[0] === \"CSPORTS_LOGO\");\n        if (csLogo) $(\"#logoLeft\").attr(\"src\", csLogo[1]);\n        showStatus(\"Базы данных успешно загружены!\", \"success\");\n    } catch (e) {\n        showStatus(\"Ошибка загрузки БД: \" + e.message, \"error\");\n    }\n}\n\n$(document).on(\"input\", \".controls\", () => handleUpdate());\n\n$(\"#dayInput\").on(\"input\", function() {\n    localStorage.setItem(\"mapstats_day\", $(this).val());\n});\n\n$(\"#clearDataBtn\").on(\"click\", function() {\n    $(\"#score1Input\").val(\"\");\n    $(\"#score2Input\").val(\"\");\n    $(\"#inputData\").val(\"\");\n    handleUpdate();\n});\n\n$(\"#tournamentInput\").on(\"input\", function() {\n    const tName = $(this).val().trim();\n    const logoRow = tables.LOGOS.find(r => r[0] === tName);\n    if (logoRow) $(\"#logoRightInput\").val(logoRow[1]);\n});\n\n$(\"#tournamentSelect\").on(\"change\", function() {\n    const val = $(this).val();\n    if (val) {\n        $(\"#tournamentInput\").val(val).trigger(\"input\");\n    }\n});\n\n$(\"#saveTournamentBtn\").on(\"click\", async function() {\n    const id = $(\"#tournamentInput\").val().trim();\n    const url = $(\"#logoRightInput\").val().trim();\n    if (!id) return;\n    $(this).text(\"⏳\");\n    await Sheets.upsert(\"LOGOS\", id, [ id, url ]);\n    $(this).text(\"💾\");\n    showStatus(\"Турнир сохранен!\", \"success\");\n});\n\n$(\"#reloadAllBtn\").on(\"click\", () => {\n    Sheets._clear();\n    loadAllSheets();\n});\n\nasync function handleUpdate() {\n    const rawData = $(\"#inputData\").val().trim();\n    if (!rawData) {\n        currentParse = {\n            team1Name: \"Team 1\",\n            team2Name: \"Team 2\",\n            team1Players: [],\n            team2Players: []\n        };\n        const empty = () => ({\n            name: \"\",\n            stats: {\n                k: \"0\",\n                a: \"0\",\n                d: \"0\",\n                adr: \"\",\n                kast: \"\",\n                rating: \"\",\n                swing: \"\",\n                kd: \"\"\n            }\n        });\n        while (currentParse.team1Players.length < 5) currentParse.team1Players.push(empty());\n        while (currentParse.team2Players.length < 5) currentParse.team2Players.push(empty());\n        renderBoard();\n        return;\n    }\n    currentParse = parseData(rawData);\n    await enforceTeamModal(currentParse.team1Name);\n    await enforceTeamModal(currentParse.team2Name);\n    renderBoard();\n}\n\nfunction parseData(rawText) {\n    const text = rawText.replace(/\\u00A0/g, \" \").replace(/\\(.*?\\)/g, \" \").replace(/[%]/g, \" \").replace(/:/g, \" \").replace(/[\\r\\n\\t]+/g, \" \").replace(/\\s{2,}/g, \" \").trim();\n    const fmt2 = /(?<name>[A-Za-z0-9_.-]{1,20})\\s+\\d+\\s+\\d+\\s+\\d+\\s+(?<kast>\\d+\\.\\d+)\\s+\\d+\\s+(?<k>\\d+)\\s+(?<a>\\d+)\\s+(?<d>\\d+)\\s+(?<adr>\\d+\\.\\d+)(?:\\s+(?<swing>[-+]?\\d+(?:\\.\\d+)?))?\\s+(?<rating>\\d+\\.\\d+)/g;\n    const fmt1 = /(?<name>[A-Za-z0-9_.-]{1,20})\\s+(?<k>\\d+)\\s+(?<a>\\d+)\\s+(?<d>\\d+)\\s+(?<adr>\\d+\\.\\d+)\\s+(?<kast>\\d+\\.\\d+)(?:\\s+(?<swing>[-+]?\\d+(?:\\.\\d+)?))?\\s+(?<rating>\\d+\\.\\d+)/g;\n    let players = [], match;\n    while ((match = fmt2.exec(text)) !== null) players.push({\n        ...match.groups,\n        index: match.index,\n        end: match.index + match[0].length\n    });\n    if (players.length === 0) while ((match = fmt1.exec(text)) !== null) players.push({\n        ...match.groups,\n        index: match.index,\n        end: match.index + match[0].length\n    });\n    let team1Name = \"Team 1\", team2Name = \"Team 2\";\n    const cleanTeam = str => {\n        let name = str.trim();\n        const half = Math.floor(name.length / 2);\n        return half > 0 && name.substring(0, half) === name.substring(half) ? name.substring(0, half) : name;\n    };\n    if (players.length > 0) team1Name = cleanTeam(text.substring(0, players[0].index).split(/Op\\.|K-D|\\bK\\b\\s+\\bA\\b\\s+\\bD\\b/)[0]) || \"Team 1\";\n    if (players.length >= 6) team2Name = cleanTeam(text.substring(players[4].end, players[5].index).split(/Op\\.|K-D|\\bK\\b\\s+\\bA\\b\\s+\\bD\\b/)[0]) || \"Team 2\";\n    const result = {\n        team1Name: team1Name,\n        team2Name: team2Name,\n        team1Players: [],\n        team2Players: []\n    };\n    const formatP = p => ({\n        name: p.name,\n        stats: {\n            k: parseInt(p.k),\n            a: parseInt(p.a),\n            d: parseInt(p.d),\n            adr: parseFloat(p.adr).toFixed(1),\n            kast: parseFloat(p.kast).toFixed(1) + \"%\",\n            rating: parseFloat(p.rating).toFixed(2),\n            swing: p.swing === undefined ? \"\" : (parseFloat(p.swing) > 0 ? \"+\" : \"\") + parseFloat(p.swing) + \"%\"\n        }\n    });\n    result.team1Players = players.slice(0, 5).map(formatP);\n    result.team2Players = players.slice(5, 10).map(formatP);\n    const empty = () => ({\n        name: \"\",\n        stats: {\n            k: \"0\",\n            a: \"0\",\n            d: \"0\",\n            adr: \"\",\n            kast: \"\",\n            rating: \"\",\n            swing: \"\",\n            kd: \"\"\n        }\n    });\n    while (result.team1Players.length < 5) result.team1Players.push(empty());\n    while (result.team2Players.length < 5) result.team2Players.push(empty());\n    return result;\n}\n\nfunction renderBoard() {\n    $(\"#tournamentName\").text($(\"#tournamentInput\").val());\n    $(\"#logoRight\").attr(\"src\", $(\"#logoRightInput\").val());\n    $(\"#score1\").text($(\"#score1Input\").val());\n    $(\"#score2\").text($(\"#score2Input\").val());\n    $(\"#mapName\").text($(\"#mapInput\").val());\n    const mapRow = tables.MAPS.find(r => r[0] === $(\"#mapInput\").val());\n    if (mapRow) {\n        $(\"#mapOverlay\").css(\"background-image\", `url('${mapRow[1]}')`).show();\n    } else {\n        $(\"#mapOverlay\").hide();\n    }\n    renderTableHead();\n    renderTeam(\"team1\", currentParse.team1Name, currentParse.team1Players);\n    renderTeam(\"team2\", currentParse.team2Name, currentParse.team2Players);\n}\n\nfunction renderTeam(prefix, fullName, players) {\n    let tName = fullName, tLogo = \"\";\n    const tRow = tables.TEAMS.find(r => r[0].toLowerCase() === fullName.toLowerCase());\n    if (tRow) {\n        if (tRow[1]) tName = tRow[1];\n        if (tRow[2]) tLogo = tRow[2];\n    }\n    const $header = $(`#${prefix}Header`).empty();\n    const $div = $(\"<div>\").addClass(\"team-cell\");\n    if (tLogo) $div.append($(\"<img>\").attr(\"src\", tLogo).addClass(\"team-logo-img\"));\n    $div.append($(\"<span>\").text(tName));\n    $header.append($div);\n    const $body = $(`#${prefix}Body`).empty();\n    players.forEach(p => {\n        const ratingNum = parseFloat(p.stats.rating);\n        const ratingClass = isNaN(ratingNum) ? \"\" : ratingNum >= 1 ? \"rating-high\" : \"rating-low\";\n        const cells = shownColumns().map(c => {\n            const v = c.get ? c.get(p.stats) : p.stats[c.key];\n            return `<td${c.key === \"rating\" ? ` class=\"${ratingClass}\"` : \"\"}>${v === undefined ? \"\" : v}<\/td>`;\n        }).join(\"\");\n        $body.append(`<tr><td colspan=\"2\" class=\"team-name\"><div class=\"team-cell\"><span>${p.name}<\/span><\/div><\/td>${cells}<\/tr>`);\n    });\n}\n\nasync function enforceTeamModal(teamName) {\n    if (!teamName || teamName === \"Team 1\" || teamName === \"Team 2\") return;\n    if (tables.TEAMS.find(r => r[0].toLowerCase() === teamName.toLowerCase())) return;\n    $(\"#modalTeamNameLabel\").text(teamName);\n    $(\"#teamModal\").css(\"display\", \"flex\");\n    $(\"#saveTeamBtn\").off(\"click\").on(\"click\", async function() {\n        const sName = $(\"#modalShortName\").val(), url = $(\"#modalTeamLogo\").val();\n        await Sheets.upsert(\"TEAMS\", teamName, [ teamName, sName, url ]);\n        tables.TEAMS.push([ teamName, sName, url ]);\n        $(\"#teamModal\").hide();\n        handleUpdate();\n    });\n}\n\n$(\"#saveDbBtn\").on(\"click\", async function() {\n    if (!currentParse) return;\n    const $btn = $(this);\n    const originalText = $btn.text();\n    $btn.text(\"Сохранение...\").prop(\"disabled\", true);\n    const tName = $(\"#tournamentInput\").val(), sheetName = `Результати ${tName}`, day = $(\"#dayInput\").val(), map = $(\"#mapInput\").val(), score1 = $(\"#score1Input\").val(), score2 = $(\"#score2Input\").val(), ts = (new Date).toISOString();\n    try {\n        await Sheets.createTable(sheetName, [ \"Player name\", \"Team name\", \"Opponent team\", \"Day\", \"Map name\", \"Op.K-D\", \"MKs\", \"KAST\", \"1vsX\", \"K (hs)\", \"A (f)\", \"D (t)\", \"ADR\", \"Swing\", \"Rating3.0\", \"Created at\", \"Score\", \"Opp score\" ]);\n    } catch (e) {}\n    const rows = [];\n    currentParse.team1Players.forEach(p => rows.push([ p.name, currentParse.team1Name, currentParse.team2Name, day, map, \"\", \"\", p.stats.kast, \"\", p.stats.k, p.stats.a, p.stats.d, \"'\" + p.stats.adr, \"\", \"'\" + p.stats.rating, ts, score1, score2 ]));\n    currentParse.team2Players.forEach(p => rows.push([ p.name, currentParse.team2Name, currentParse.team1Name, day, map, \"\", \"\", p.stats.kast, \"\", p.stats.k, p.stats.a, p.stats.d, \"'\" + p.stats.adr, \"\", \"'\" + p.stats.rating, ts, score2, score1 ]));\n    try {\n        await Sheets.insert(sheetName, rows);\n        $btn.text(\"Сохранено!\");\n    } catch (e) {\n        $btn.text(\"Ошибка\");\n    } finally {\n        setTimeout(() => {\n            $btn.text(originalText).prop(\"disabled\", false);\n        }, 1500);\n    }\n});\n\nfunction showStatus(msg, type) {\n    const $st = $(\"#statusMessage\").text(msg).removeClass(\"success error info\").addClass(type).show();\n    setTimeout(() => $st.hide(), 5e3);\n}\n\n$(\"#downloadBtn\").on(\"click\", function() {\n    const $btn = $(this).text(\"⏳ Создание...\");\n    html2canvas(document.getElementById(\"board\"), {\n        useCORS: true,\n        scale: 2,\n        backgroundColor: null,\n        onclone: d => d.getElementById(\"board\").style.transform = \"none\"\n    }).then(canvas => {\n        const link = document.createElement(\"a\");\n        link.download = \"mapstats-board.png\";\n        link.href = canvas.toDataURL(\"image/png\");\n        link.click();\n        $btn.text(\"Скачать (PNG)\");\n    });\n});\n\n$(\"#shareBtn\").on(\"click\", async function() {\n    try {\n        const canvas = await html2canvas(document.getElementById(\"board\"), {\n            useCORS: true,\n            scale: 2,\n            backgroundColor: null,\n            onclone: d => d.getElementById(\"board\").style.transform = \"none\"\n        });\n        canvas.toBlob(async blob => {\n            const file = new File([ blob ], \"mapstats.png\", {\n                type: \"image/png\"\n            });\n            if (navigator.canShare && navigator.canShare({\n                files: [ file ]\n            })) {\n                await navigator.share({\n                    files: [ file ]\n                });\n            } else {\n                showStatus(\"Ваш браузер не поддерживает Share API.\", \"error\");\n            }\n        });\n    } catch (e) {\n        showStatus(\"Ошибка при попытке поделиться: \" + e.message, \"error\");\n    }\n});\n\n$(\"#closeModalBtn\").on(\"click\", () => $(\"#teamModal\").hide());\n\nfunction fitMapBoard() {\n    const wrap = document.getElementById(\"boardWrap\");\n    const board = document.getElementById(\"board\");\n    const k = Math.min(1, wrap.clientWidth / 521);\n    board.style.transform = `scale(${k})`;\n    board.style.transformOrigin = \"0 0\";\n    wrap.style.height = board.offsetHeight * k + \"px\";\n}\n\nnew ResizeObserver(fitMapBoard).observe(document.getElementById(\"boardWrap\"));\n\nnew ResizeObserver(fitMapBoard).observe(document.getElementById(\"board\"));\n<\/script>\n    <\/body>\n<\/html>\n",
"team": "<!doctype html>\n<html lang=\"ru\">\n    <head>\n        <meta charset=\"UTF-8\" />\n        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n        <title>Итоги команды<\/title>\n        <style>\nhtml {\n  color-scheme: light;\n}\n* {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n  font-size: 16px;\n}\nhtml {\n  width: 100%;\n}\nbody {\n  background: #f2f2f7;\n  font-family:\n    -apple-system,\n    BlinkMacSystemFont,\n    \"Segoe UI\",\n    Roboto,\n    Helvetica,\n    Arial,\n    sans-serif;\n  padding: 20px 16px;\n  align-items: center;\n  display: flex;\n  flex-direction: column;\n}\n.app-container {\n  display: flex;\n  flex-direction: column;\n  width: 100%;\n  max-width: 1100px;\n  align-items: center;\n  gap: 24px;\n}\n.controls {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  max-width: 521px;\n  min-width: 0;\n  width: 100%;\n}\n.row-label {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  background: #ffffff;\n  padding: 12px 16px;\n  border-radius: 12px;\n  font-size: 16px;\n  font-weight: 500;\n  color: #1c1c1e;\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);\n}\n.col-label {\n  display: flex;\n  flex-direction: column;\n  background: #ffffff;\n  padding: 12px 16px;\n  border-radius: 12px;\n  font-size: 16px;\n  font-weight: 500;\n  color: #1c1c1e;\n  gap: 8px;\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);\n}\n.controls span {\n  white-space: nowrap;\n}\n.controls input,\n.controls select,\n.controls textarea {\n  padding: 8px 12px;\n  font-family: inherit;\n  font-size: 16px;\n  border-radius: 8px;\n  border: none;\n  background: #f2f2f7;\n  color: #1c1c1e;\n  outline: none;\n  transition: background 0.2s;\n}\n.controls input:focus,\n.controls select:focus,\n.controls textarea:focus {\n  background: #e5e5ea;\n}\n.controls textarea {\n  height: 120px;\n  resize: vertical;\n  width: 100%;\n}\n.input-group {\n  display: flex;\n  gap: 6px;\n  align-items: center;\ n  object-fit: initial;\n}\n.player-col .shade {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  background:\n    linear-gradient(\n      180deg,\n      rgba(3, 6, 11, 0),\n      #03060b 110px,\n      #03060b);\n}\n.player-col .tint {\n  position: absolute;\n  inset: 0;\n  background:\n    linear-gradient(\n      180deg,\n      var(--c),\n      rgba(0, 0, 0, 0) 60%);\n  opacity: 0.3;\n}\n.player-col img.photo-shadow {\n  height: auto;\n  object-fit: initial;\n}\n.player-col .nick.with-photo {\n  bottom: 22px;\n  font-size: 28px;\n  color: #fff;\n  text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);\n}\n<\/style>\n        <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n        <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin />\n        <link href=\"https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Montserrat:wght@600;700&family=Oswald:wght@700&display=swap\" rel=\"stylesheet\" />\n        <script src=\"https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js\"><\/script>\n    <\/head>\n    <body>\n        <div id=\"statusMessage\" class=\"status\"><\/div>\n        <div class=\"app-container\">\n            <div class=\"controls\">\n                <label class=\"row-label\">\n                    <span>Турнир:<\/span>\n                    <select id=\"tournament\"><\/select>\n                <\/label>\n                <label class=\"row-label\">\n                    <span>Команда:<\/span>\n                    <select id=\"team\"><\/select>\n                <\/label>\n                <label class=\"col-label\">\n                    <span>Шаблон заголовка:<\/span>\n                    <input type=\"text\" id=\"titleTpl\" value=\"{team} HA {tournament}\" />\n                <\/label>\n                <label class=\"col-label\">\n                    <span>Заголовок:<\/span>\n                    <input type=\"text\" id=\"titleText\" />\n                <\/label>\n                <div id=\"roster\" class=\"controls\"><\/div>\n                <div class=\"col-label\">\n                    <div class=\"series-head\">\n                        <span>Серии на картинке:<\/span>\n                        <span class=\"series-btns\">\n                            <button type=\"button\" id=\"seriesAll\" class=\"icon-btn\">Все<\/button>\n                            <button type=\"button\" id=\"seriesNone\" class=\"icon-btn\">Ни одной<\/button>\n                        <\/span>\n                    <\/div>\n                    <div id=\"series\" class=\"series-list\"><\/div>\n                <\/div>\n                <details class=\"col-label\">\n                    <summary>Логотипы команд<\/summary>\n                    <div id=\"logos\" class=\"controls\"><\/div>\n                <\/details>\n                <div class=\"action-buttons\">\n                    <button id=\"refreshData\" class=\"secondary-btn\">Обновить данные из таблицы<\/button>\n                    <button id=\"savePhotos\" class=\"secondary-btn\">Сохранить фото в таблицу<\/button>\n                    <div class=\"btn-group\">\n                        <button id=\"download\" class=\"secondary-btn\">Скачать (PNG)<\/button>\n                        <button id=\"share\" class=\"secondary-btn\">Поделиться<\/button>\n                    <\/div>\n                <\/div>\n            <\/div>\n            <div class=\"preview\">\n                <div class=\"board team\" id=\"board\"><\/div>\n            <\/div>\n        <\/div>\n        <script>\nconst Stats = function() {\n    const toNum = v => {\n        const n = parseFloat(String(v).replace(\",\", \".\"));\n        return Number.isNaN(n) ? null : n;\n    };\n    const round2 = n => Math.round(n * 100) / 100;\n    const mean = arr => arr.reduce((s, x) => s + x, 0) / arr.length;\n    const wmean = items => items.reduce((s, x) => s + x.rating * x.weight, 0) / items.reduce((s, x) => s + x.weight, 0);\n    const SERIES_BIAS = {\n        base: .0085,\n        perExtraMap: .0064,\n        perVariance: .139\n    };\n    function seriesRating(items) {\n        const m = wmean(items);\n        if (items.length < 2) return m;\n        const w = items.reduce((s, x) => s + x.weight, 0);\n        const variance = items.reduce((s, x) => s + x.weight * (x.rating - m) ** 2, 0) / w;\n        return m - (SERIES_BIAS.base + SERIES_BIAS.perExtraMap * (items.length - 1) + SERIES_BIAS.perVariance * variance);\n    }\n    function inferRounds(group) {\n        const ks = group.map(r => r.kast).filter(v => v !== null);\n        if (ks.length < 6) return null;\n        const minRounds = Math.max(13, ...group.map(r => r.deaths || 0));\n        for (let n = minRounds; n <= 60; n++) if (ks.every(k => Math.abs(Math.round(k * n / 100) / n * 100 - k) <= .051)) return n;\n        return null;\n    }\n    function parseResults(data) {\n        const rows = data.slice(1).filter(r => r[0] && r[1]).map(r => ({\n            player: String(r[0]).trim(),\n            team: String(r[1]).trim(),\n            opponent: String(r[2]).trim(),\n            day: Number(r[3]) || 0,\n            map: String(r[4]),\n            kast: toNum(r[7]),\n            deaths: toNum(r[11]),\n            rating: toNum(r[14]),\n            createdAt: String(r[15] || \"\"),\n            score: toNum(r[16] === undefined ? \"\" : r[16]),\n            oppScore: toNum(r[17] === undefined ? \"\" : r[17])\n        })).filter(r => r.rating !== null);\n        const groups = new Map;\n        rows.forEach(r => {\n            const key = `${r.day}|${r.map}|${[ r.team, r.opponent ].sort().join(\"|\")}`;\n            if (!groups.has(key)) groups.set(key, []);\n            groups.get(key).push(r);\n        });\n        const known = [];\n        groups.forEach(g => {\n            const n = inferRounds(g);\n            g.forEach(r => r.rounds = n);\n            if (n) known.push(n);\n        });\n        const fallback = known.length ? mean(known) : 1;\n        rows.forEach(r => r.weight = r.rounds || fallback);\n        return rows;\n    }\n    const unique = arr => [ ...new Set(arr) ];\n    const TOTAL_MAP = /^(total|all|all maps|все|все карты|итог|итого)$/i;\n    const isTotal = r => TOTAL_MAP.test(r.map.trim());\n    function effective(rows) {\n        const hasTotal = new Set(rows.filter(isTotal).map(r => `${r.day}|${[ r.team, r.opponent ].sort().join(\"|\")}`));\n        return rows.filter(r => isTotal(r) === hasTotal.has(`${r.day}|${[ r.team, r.opponent ].sort().join(\"|\")}`));\n    }\n    const mapKey = r => `${r.day}|${r.opponent}|${r.map}`;\n    function teamsIn(rows) {\n        return unique(rows.map(r => r.team)).sort((a, b) => a.localeCompare(b));\n    }\n    function roster(rows, team) {\n        const byPlayer = new Map;\n        const mine = rows.filter(r => r.team === team);\n        const eff = new Set(effective(mine));\n        mine.forEach(r => {\n            if (!byPlayer.has(r.player)) byPlayer.set(r.player, []);\n            byPlayer.get(r.player).push(r);\n        });\n        return [ ...byPlayer.entries() ].map(([player, rs]) => ({\n            player: player,\n            maps: unique(rs.filter(r => !isTotal(r)).map(mapKey)).length,\n            avg: round2(wmean(rs.filter(r => eff.has(r))))\n        })).sort((a, b) => b.maps - a.maps || a.player.localeCompare(b.player));\n    }\n    function seriesResult(rows) {\n        const maps = new Map;\n        rows.forEach(r => {\n            if (!isTotal(r) && !maps.has(r.map)) maps.set(r.map, r);\n        });\n        if (!maps.size) return null;\n        let won = 0;\n        let lost = 0;\n        for (const r of maps.values()) {\n            if (r.score === null || r.oppScore === null || r.score === r.oppScore) return null;\n            if (r.score > r.oppScore) won++; else lost++;\n        }\n        return won > lost ? \"W\" : lost > won ? \"L\" : null;\n    }\n    function series(rows, team) {\n        const groups = new Map;\n        effective(rows).filter(r => r.team === team).forEach(r => {\n            const key = `${r.day}|${r.opponent}`;\n            if (!groups.has(key)) groups.set(key, {\n                opponent: r.opponent,\n                day: r.day,\n                firstSeen: r.createdAt,\n                perPlayer: new Map,\n                maps: new Set\n            });\n            const g = groups.get(key);\n            if (r.createdAt < g.firstSeen) g.firstSeen = r.createdAt;\n            g.maps.add(r.map);\n            if (!g.perPlayer.has(r.player)) g.perPlayer.set(r.player, []);\n            g.perPlayer.get(r.player).push(r);\n        });\n        return [ ...groups.values() ].sort((a, b) => a.day - b.day || a.firstSeen.localeCompare(b.firstSeen)).map(g => ({\n            opponent: g.opponent,\n            day: g.day,\n            mapCount: g.maps.size,\n            result: seriesResult(rows.filter(r => r.team === team && r.day === g.day && r.opponent === g.opponent)),\n            ratings: Object.fromEntries([ ...g.perPlayer ].map(([p, v]) => [ p, round2(seriesRating(v)) ]))\n        }));\n    }\n    function playerValues(seriesList, player) {\n        return seriesList.map(s => s.ratings[player] === undefined ? null : s.ratings[player]);\n    }\n    function leaderboard(rows, minMaps = 1) {\n        const byPlayer = new Map;\n        const eff = new Set(effective(rows));\n        rows.forEach(r => {\n            if (!byPlayer.has(r.player)) byPlayer.set(r.player, []);\n            byPlayer.get(r.player).push(r);\n        });\n        return [ ...byPlayer.entries() ].map(([player, rs]) => {\n            const perTeam = new Map;\n            rs.forEach(r => perTeam.set(r.team, (perTeam.get(r.team) || 0) + 1));\n            const team = [ ...perTeam.entries() ].sort((a, b) => b[1] - a[1])[0][0];\n            return {\n                player: player,\n                team: team,\n                maps: unique(rs.filter(r => !isTotal(r)).map(mapKey)).length,\n                avg: round2(wmean(rs.filter(r => eff.has(r))))\n            };\n        }).filter(p => p.maps >= minMaps).sort((a, b) => b.avg - a.avg || b.maps - a.maps);\n    }\n    const fmt = (v, sep = \",\") => v === null || v === undefined ? \"\" : v.toFixed(2).replace(\".\", sep);\n    return {\n        parseResults: parseResults,\n        inferRounds: inferRounds,\n        seriesRating: seriesRating,\n        isTotal: isTotal,\n        effective: effective,\n        teamsIn: teamsIn,\n        roster: roster,\n        series: series,\n        playerValues: playerValues,\n        leaderboard: leaderboard,\n        fmt: fmt,\n        round2: round2\n    };\n}();\n\nif (typeof module !== \"undefined\") module.exports = Stats;\n<\/script>\n        <script>\nconst API_URL = \"https://script.google.com/macros/s/AKfycbxJZEfppSo6QZpmpiEDR1FaOpIjHdfQDXdj-x80uoIy-SU30nKgIgfvr3DNgQbroi53/exec\";\n\nconst SHEET_ID = \"188jMHUJs1KkmCAzG7XZYTnTY9SnNIx0JlXJoEdMTees\";\n\nconst Sheets = {\n    TTL_MS: 2 * 60 * 1e3,\n    MISSING_TTL_MS: 10 * 1e3,\n    _mem: new Map,\n    _fresh: v => Date.now() - v.t < (v.data === null ? Sheets.MISSING_TTL_MS : Sheets.TTL_MS),\n    _cached(name) {\n        const hit = Sheets._mem.get(name);\n        if (hit && Sheets._fresh(hit)) return hit;\n        try {\n            const raw = sessionStorage.getItem(\"csports:sheet:\" + name);\n            if (raw) {\n                const v = JSON.parse(raw);\n                if (Sheets._fresh(v)) {\n                    Sheets._mem.set(name, v);\n                    return v;\n                }\n            }\n        } catch (e) {}\n        return null;\n    },\n    _store(name, data) {\n        const v = {\n            t: Date.now(),\n            data: data\n        };\n        Sheets._mem.set(name, v);\n        try {\n            sessionStorage.setItem(\"csports:sheet:\" + name, JSON.stringify(v));\n        } catch (e) {}\n    },\n    _clear() {\n        Sheets._mem.clear();\n        try {\n            Object.keys(sessionStorage).filter(k => k.startsWith(\"csports:sheet:\")).forEach(k => sessionStorage.removeItem(k));\n        } catch (e) {}\n    },\n    async _get(params) {\n        const url = new URL(API_URL);\n        url.searchParams.set(\"sheetId\", SHEET_ID);\n        Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));\n        const json = await (await fetch(url)).json();\n        if (!json.success) throw new Error(json.error);\n        return json.data;\n    },\n    async select(sheetName) {\n        const hit = Sheets._cached(sheetName);\n        if (hit) {\n            if (hit.data === null) throw new Error(\"Table does not exist\");\n            return hit.data;\n        }\n        let data;\n        try {\n            data = await Sheets._get({\n                sheetName: sheetName\n            });\n        } catch (e) {\n            if (/does not exist/i.test(e.message)) Sheets._store(sheetName, null);\n            throw e;\n        }\n        Sheets._store(sheetName, data);\n        return data;\n    },\n    async prefetch(names) {\n        const todo = [ ...new Set(names) ].filter(n => !Sheets._cached(n));\n        if (!todo.length) return;\n        try {\n            const all = await Sheets._get({\n                sheetNames: JSON.stringify(todo)\n            });\n            if (!all || typeof all !== \"object\" || Array.isArray(all)) throw new Error(\"no batch\");\n            todo.forEach(n => Sheets._store(n, all[n] === undefined ? null : all[n]));\n        } catch (e) {\n            await Promise.all(todo.map(n => Sheets.select(n).catch(() => {})));\n        }\n    },\n    async bootstrap() {\n        const names = [ \"TEAMS\", \"PLAYERS\", \"LOGOS\", \"MAPS\" ];\n        try {\n            const t = localStorage.getItem(\"csports:tournament\");\n            if (t) names.push(`Результати ${t}`);\n        } catch (e) {}\n        await Sheets.prefetch(names);\n    },\n    async post(payload) {\n        Sheets._clear();\n        const res = await fetch(API_URL, {     Data.pref.set(\"team.\" + $(\"tournament\").value, state.team);\n    state.series = Stats.series(state.rows, state.team);\n    state.candidates = Stats.roster(state.rows, state.team);\n    state.roster = state.candidates.slice(0, 5).map(c => c.player);\n    renderRosterEditor();\n    loadResults();\n    renderSeriesEditor();\n    Logos.render($(\"logos\"), state.series.map(s => s.opponent), state.teams, render);\n    refreshTitle();\n    render();\n}\n\nconst shownResults = series => Object.fromEntries(series.map(s => {\n    const m = state.results[serieKey(s)];\n    return [ serieKey(s), m === \"-\" ? \"\" : m || s.result || \"\" ];\n}));\n\nconst prefKey = what => `${what}:${$(\"tournament\").value}|${state.team}`;\n\nfunction loadResults() {\n    try {\n        state.results = JSON.parse(Data.pref.get(prefKey(\"results\"), \"{}\"));\n    } catch (e) {\n        state.results = {};\n    }\n    try {\n        state.hidden = new Set(JSON.parse(Data.pref.get(prefKey(\"hidden\"), \"[]\")));\n    } catch (e) {\n        state.hidden = new Set;\n    }\n}\n\nconst saveSeriesPrefs = () => {\n    Data.pref.set(prefKey(\"results\"), JSON.stringify(state.results));\n    Data.pref.set(prefKey(\"hidden\"), JSON.stringify([ ...state.hidden ]));\n};\n\nfunction renderSeriesEditor() {\n    const box = $(\"series\");\n    box.innerHTML = \"\";\n    state.series.forEach(s => {\n        const key = serieKey(s);\n        const row = document.createElement(\"label\");\n        row.className = \"series-row\";\n        const check = document.createElement(\"input\");\n        check.type = \"checkbox\";\n        check.checked = !state.hidden.has(key);\n        const name = document.createElement(\"span\");\n        name.className = \"series-name\";\n        name.textContent = `День ${s.day}: ${state.teams.get(s.opponent).short}`;\n        const sel = document.createElement(\"select\");\n        [ [ \"\", s.result ? `авто: ${s.result}` : \"авто: нет\" ], [ \"W\", \"W\" ], [ \"L\", \"L\" ], [ \"-\", \"нет\" ] ].forEach(([v, label]) => {\n            const o = document.createElement(\"option\");\n            o.value = v;\n            o.textContent = label;\n            o.selected = (state.results[key] || \"\") === v;\n            sel.append(o);\n        });\n        check.onchange = () => {\n            if (check.checked) state.hidden.delete(key); else state.hidden.add(key);\n            saveSeriesPrefs();\n            render();\n        };\n        sel.onchange = () => {\n            if (sel.value) state.results[key] = sel.value; else delete state.results[key];\n            saveSeriesPrefs();\n            render();\n        };\n        row.append(check, name, sel);\n        box.append(row);\n    });\n}\n\nfunction refreshTitle() {\n    $(\"titleText\").value = Board.fillTitle($(\"titleTpl\").value, {\n        team: state.teams.get(state.team).short,\n        tournament: $(\"tournament\").value\n    });\n}\n\nfunction renderRosterEditor() {\n    const box = $(\"roster\");\n    box.innerHTML = \"\";\n    const names = state.candidates.map(c => c.player);\n    state.roster.forEach((nick, slot) => {\n        const row = document.createElement(\"div\");\n        row.className = \"col-label slot\";\n        const top = document.createElement(\"div\");\n        top.className = \"slot-top\";\n        const sel = document.createElement(\"select\");\n        UI.fillSelect(sel, names, nick);\n        const color = document.createElement(\"input\");\n        color.type = \"color\";\n        color.value = Data.getColor(state.team, nick, slot);\n        const photo = document.createElement(\"input\");\n        photo.type = \"text\";\n        photo.placeholder = \"URL фото команды (с формой)\";\n        photo.value = state.players.get(nick).photoTeam;\n        sel.onchange = () => {\n            state.roster[slot] = sel.value;\n            color.value = Data.getColor(state.team, sel.value, slot);\n            photo.value = state.players.get(sel.value).photoTeam;\n            render();\n        };\n        color.oninput = () => {\n            Data.setColor(state.team, state.roster[slot], color.value);\n            render();\n        };\n        photo.oninput = () => {\n            const p = state.players.get(state.roster[slot]);\n            state.players.set({\n                ...p,\n                photoTeam: photo.value.trim()\n            });\n            render();\n        };\n        top.append(sel, color);\n        row.append(top, photo);\n        box.append(row);\n    });\n}\n\nlet renderToken = 0;\n\nasync function render() {\n    const series = visibleSeries();\n    if (!series.length) {\n        $(\"board\").innerHTML = \"\";\n        return;\n    }\n    const token = ++renderToken;\n    const srcs = await Board.opponentLogos(series, state.teams);\n    if (token !== renderToken) return;\n    const cuts = await Promise.all(state.roster.map(nick => Board.cutout(state.players.get(nick).photoTeam)));\n    const photos = await Promise.all(state.roster.map((nick, i) => cuts[i] || Board.safeSrc(state.players.get(nick).photoTeam)));\n    if (token !== renderToken) return;\n    const boxes = await Promise.all(state.roster.map(async nick => {\n        const got = await Board.loadImage(state.players.get(nick).photoTeam);\n        if (!got) return null;\n        const ratio = got.img.naturalWidth / got.img.naturalHeight;\n        const width = Math.round(Math.max(300, Math.min(600, 536 * ratio)));\n        return {\n            width: width,\n            left: Math.round(127 - width / 2),\n            height: width / ratio + PHOTO_TOP\n        };\n    }));\n    const sharp = await Promise.all(state.roster.map((nick, i) => boxes[i] && photos[i] ? Board.enhance(photos[i], boxes[i].width) : photos[i]));\n    const shadows = await Promise.all(state.roster.map((nick, i) => boxes[i] && photos[i] ? Board.photoShadow(photos[i], boxes[i].width).catch(() => null) : null));\n    if (token !== renderToken) return;\n    const cols = state.roster.map((nick, slot) => ({\n        nick: nick,\n        color: Data.getColor(state.team, nick, slot),\n        values: Stats.playerValues(series, nick),\n        photo: sharp[slot] || photos[slot],\n        keyed: Boolean(cuts[slot]),\n        box: boxes[slot],\n        shadow: shadows[slot]\n    }));\n    const pitch = Math.min(32.5, 370 / series.length);\n    const panels = await Promise.all(cols.map((c, slot) => Board.column(c.color, c.photo && c.box ? {\n        src: c.photo,\n        box: {\n            width: c.box.width,\n            left: c.box.left,\n            top: PHOTO_TOP\n        },\n        shadow: c.shadow\n    } : {\n        src: Board.silhouette(),\n        box: {\n            width: 190,\n            left: 0,\n            top: 0\n        },\n        shadow: null\n    }, slot)));\n    if (token !== renderToken) return;\n    const strip = panels.map(src => `<div class=\"player-col\"><img src=\"${src}\" alt=\"\"><\/div>`).join(\"\");\n    const labels = cols.map(c => `<div class=\"player-col\">\\n                <div class=\"nick${c.photo ? \" with-photo\" : \"\"}\">${Board.esc(c.nick)}<\/div>\\n                <div class=\"nums\" style=\"--p:${pitch}px\">${c.values.map(v => Stats.fmt(v) || \"&nbsp;\").join(\"<br>\")}<\/div>\\n            <\/div>`).join(\"\");\n    const chart = Chart.render({\n        lines: cols.map(c => ({\n            color: c.color,\n            values: c.values\n        })),\n        axis: Chart.fitAxis(cols.flatMap(c => c.values))\n    });\n    $(\"board\").innerHTML = `<div class=\"strip\">${strip}<\/div>\\n        <div class=\"s-glow\"><\/div>\\n        <div class=\"strip\">${labels}<\/div>\\n        <div class=\"chart\">${chart}<\/div>\\n        ${Board.logosRow(series, state.teams, shownResults(series), srcs)}\\n        ${Board.title($(\"titleText\").value)}\\n        ${Board.footer()}`;\n    Board.fitTitle($(\"board\"));\n    Board.fitFooter($(\"board\"));\n}\n\n$(\"seriesAll\").onclick = () => {\n    state.hidden.clear();\n    saveSeriesPrefs();\n    renderSeriesEditor();\n    render();\n};\n\n$(\"seriesNone\").onclick = () => {\n    state.series.forEach(s => state.hidden.add(serieKey(s)));\n    saveSeriesPrefs();\n    renderSeriesEditor();\n    render();\n};\n\nUI.fitBoard(document.querySelector(\".preview\"), $(\"board\"));\n\n$(\"tournament\").onchange = onTournament;\n\n$(\"team\").onchange = onTeam;\n\n$(\"titleTpl\").oninput = () => {\n    Data.pref.set(\"titleTpl.team\", $(\"titleTpl\").value);\n    refreshTitle();\n    render();\n};\n\n$(\"titleText\").oninput = render;\n\n$(\"download\").onclick = async () => {\n    try {\n        await Board.download($(\"board\"), `${state.team}-team-result.png`);\n    } catch (e) {\n        UI.status(\"Ошибка экспорта: \" + e.message, \"error\");\n    }\n};\n\n$(\"share\").onclick = async () => {\n    try {\n        await Board.share($(\"board\"), `${state.team}-team-result.png`);\n    } catch (e) {\n        UI.status(e.message.startsWith(\"Ваш\") ? e.message : \"Ошибка при попытке поделиться: \" + e.message, \"error\");\n    }\n};\n\n$(\"savePhotos\").onclick = async () => {\n    if (!confirm(\"Записать ссылки на фото этих 5 игроков в лист PLAYERS?\")) return;\n    try {\n        await state.players.saveMany(state.roster.map(nick => state.players.get(nick)));\n        UI.status(\"Сохранено\", \"success\");\n    } catch (e) {\n        UI.status(\"Ошибка сохранения: \" + e.message, \"error\");\n    }\n};\n\n$(\"refreshData\").onclick = () => {\n    Sheets._clear();\n    init();\n};\n\ninit();\n<\/script>\n    <\/body>\n<\/html>\n"
};

        <script>
const API_URL = "https://script.google.com/macros/s/AKfycbxJZEfppSo6QZpmpiEDR1FaOpIjHdfQDXdj-x80uoIy-SU30nKgIgfvr3DNgQbroi53/exec";

const SHEET_ID = "188jMHUJs1KkmCAzG7XZYTnTY9SnNIx0JlXJoEdMTees";

const Sheets = {
    TTL_MS: 2 * 60 * 1e3,
    MISSING_TTL_MS: 10 * 1e3,
    _mem: new Map,
    _fresh: v => Date.now() - v.t < (v.data === null ? Sheets.MISSING_TTL_MS : Sheets.TTL_MS),
    _cached(name) {
        const hit = Sheets._mem.get(name);
        if (hit && Sheets._fresh(hit)) return hit;
        try {
            const raw = sessionStorage.getItem("csports:sheet:" + name);
            if (raw) {
                const v = JSON.parse(raw);
                if (Sheets._fresh(v)) {
                    Sheets._mem.set(name, v);
                    return v;
                }
            }
        } catch (e) {}
        return null;
    },
    _store(name, data) {
        const v = {
            t: Date.now(),
            data: data
        };
        Sheets._mem.set(name, v);
        try {
            sessionStorage.setItem("csports:sheet:" + name, JSON.stringify(v));
        } catch (e) {}
    },
    _clear() {
        Sheets._mem.clear();
        try {
            Object.keys(sessionStorage).filter(k => k.startsWith("csports:sheet:")).forEach(k => sessionStorage.removeItem(k));
        } catch (e) {}
    },
    async _get(params) {
        const url = new URL(API_URL);
        url.searchParams.set("sheetId", SHEET_ID);
        Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
        const json = await (await fetch(url)).json();
        if (!json.success) throw new Error(json.error);
        return json.data;
    },
    async select(sheetName) {
        const hit = Sheets._cached(sheetName);
        if (hit) {
            if (hit.data === null) throw new Error("Table does not exist");
            return hit.data;
        }
        let data;
        try {
            data = await Sheets._get({
                sheetName: sheetName
            });
        } catch (e) {
            if (/does not exist/i.test(e.message)) Sheets._store(sheetName, null);
            throw e;
        }
        Sheets._store(sheetName, data);
        return data;
    },
    async prefetch(names) {
        const todo = [ ...new Set(names) ].filter(n => !Sheets._cached(n));
        if (!todo.length) return;
        try {
            const all = await Sheets._get({
                sheetNames: JSON.stringify(todo)
            });
            if (!all || typeof all !== "object" || Array.isArray(all)) throw new Error("no batch");
            todo.forEach(n => Sheets._store(n, all[n] === undefined ? null : all[n]));
        } catch (e) {
            await Promise.all(todo.map(n => Sheets.select(n).catch(() => {})));
        }
    },
    async bootstrap() {
        const names = [ "TEAMS", "PLAYERS", "LOGOS", "MAPS" ];
        try {
            const t = localStorage.getItem("csports:tournament");
            if (t) names.push(`Результати ${t}`);
        } catch (e) {}
        await Sheets.prefetch(names);
    },
    async post(payload) {
        Sheets._clear();
        const res = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                ...payload,
                sheetId: SHEET_ID
            })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        return json.data;
    },
    upsert: (sheetName, keyMatchValue, rowData) => Sheets.post({
        operation: "UPSERT",
        sheetName: sheetName,
        keyColumnIndex: 0,
        keyMatchValue: keyMatchValue,
        rowData: rowData
    }),
    async upsertMany(sheetName, rows, headers) {
        try {
            const r = await Sheets.post({
                operation: "UPSERT_MANY",
                sheetName: sheetName,
                keyColumnIndex: 0,
                rows: rows,
                headers: headers
            });
            if (r && typeof r.updated === "number") return r;
        } catch (e) {
            if (!/does not exist/i.test(e.message)) throw e;
        }
        if (headers) await Sheets.ensureTable(sheetName, headers);
        for (const row of rows) await Sheets.upsert(sheetName, row[0], row);
        return {
            updated: rows.length,
            inserted: 0
        };
    },
    insert: (sheetName, rows) => Sheets.post({
        operation: "INSERT",
        sheetName: sheetName,
        rows: rows
    }),
    createTable: (sheetName, headers) => Sheets.post({
        operation: "CREATE_TABLE",
        sheetName: sheetName,
        headers: headers
    }),
    async ensureTable(sheetName, headers) {
        try {
            await Sheets.createTable(sheetName, headers);
        } catch (e) {
            if (/already exists/i.test(e.message)) return;
            try {
                Sheets._clear();
                await Sheets.select(sheetName);
            } catch (e2) {
                throw e;
            }
        }
    }
};

if (typeof module !== "undefined") module.exports = Sheets;
</script>
        <script>
const TABS = [ [ "map", "Карты" ], [ "team", "Итоги команды" ] ];

const frames = {};

const tabsEl = document.getElementById("tabs");

const framesEl = document.getElementById("frames");

let active = "";

TABS.forEach(([key, title]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = title;
    b.dataset.key = key;
    b.onclick = () => show(key);
    tabsEl.append(b);
});

function fit(frame) {
    const d = frame.contentDocument;
    if (!d || !d.body || !frame.classList.contains("active")) return;
    frame.style.height = d.body.offsetHeight + "px";
}

function follow(frame) {
    const d = frame.contentDocument;
    if (!d || !frame.classList.contains("active")) return;
    const pv = d.querySelector(".preview");
    if (!pv) return;
    if (frame.clientWidth < 1100) {
        pv.style.transform = "";
        return;
    }
    const box = pv.parentElement;
    const natural = box.offsetTop + (pv.offsetTop - box.offsetTop);
    const gone = -frame.getBoundingClientRect().top;
    const room = box.offsetHeight - pv.offsetHeight;
    const y = Math.max(0, Math.min(room, gone + 16 - natural));
    pv.style.transform = y ? `translateY(${y}px)` : "";
}

function watchToast(frame) {
    const d = frame.contentDocument;
    const el = d.getElementById("statusMessage");
    if (!el) return;
    const place = () => {
        if (el.style.display === "none" || !el.style.display) return;
        const top = Math.max(0, -frame.getBoundingClientRect().top) + 10;
        el.style.position = "absolute";
        el.style.left = "50%";
        el.style.transform = "translateX(-50%)";
        el.style.top = top + "px";
        el.style.zIndex = 2e3;
        el.style.margin = "0";
    };
    new MutationObserver(place).observe(el, {
        attributes: true,
        attributeFilter: [ "style", "class" ]
    });
}

function create(key) {
    const f = document.createElement("iframe");
    f.title = key;
    f.setAttribute("allow", "web-share; clipboard-write");
    f.onload = () => {
        const d = f.contentDocument;
        if (!d || !d.body) return;
        new ResizeObserver(() => fit(f)).observe(d.body);
        watchToast(f);
        fit(f);
    };
    f.srcdoc = window.__PAGES__[key];
    framesEl.append(f);
    frames[key] = f;
}

function show(key) {
    if (!frames[key]) create(key);
    active = key;
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle("active", k === key));
    tabsEl.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.key === key));
    try {
        localStorage.setItem("csports:tab", key);
    } catch (e) {}
    history.replaceState(null, "", "#" + key);
    fit(frames[key]);
    follow(frames[key]);
}

window.addEventListener("scroll", () => active && follow(frames[active]), {
    passive: true
});

window.addEventListener("resize", () => {
    if (!active) return;
    fit(frames[active]);
    follow(frames[active]);
});

(async function() {
    framesEl.innerHTML = '<div id="loading">Загрузка...</div>';
    try {
        await Sheets.bootstrap();
    } catch (e) {}
    framesEl.innerHTML = "";
    let key = location.hash.slice(1);
    try {
        key = key || localStorage.getItem("csports:tab") || "";
    } catch (e) {}
    show(TABS.some(([k]) => k === key) ? key : TABS[0][0]);
})();
</script>
