<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Light Control — Minimal</title>
<style>
:root{
  color-scheme:dark;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#07090f;
  --card:#0f131d;
  --card2:#101622;
  --line:#ffffff14;
  --text:#f4f7ff;
  --muted:#8b94aa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
  overscroll-behavior:none;
}
body{
  position:relative;
  background:var(--bg);
  color:var(--text);
  isolation:isolate;
  --main-level:.72;
  --accent-level:.45;
  --bg-lift:.40;
}
.ambient, .darkness{
  position:fixed;
  inset:0;
  pointer-events:none;
}
.ambient{
  z-index:0;
  transition:opacity .18s linear, filter .18s linear;
}
.ambient-main{
  background:
    radial-gradient(circle at 24% 18%, rgba(255,197,138,.95) 0, rgba(255,197,138,.45) 18%, rgba(255,197,138,0) 42%),
    radial-gradient(circle at 50% 45%, rgba(255,235,205,.26) 0, rgba(255,235,205,0) 52%);
  opacity:var(--main-level);
  filter:blur(14px);
}
.ambient-accent{
  background:
    radial-gradient(circle at 78% 72%, rgba(255,183,102,.72) 0, rgba(255,183,102,.26) 20%, rgba(185,167,255,0) 44%),
    radial-gradient(circle at 88% 14%, rgba(255,218,162,.34) 0, rgba(158,201,255,0) 34%);
  opacity:calc(var(--accent-level) * .9);
  filter:blur(18px);
}
.darkness{
  z-index:1;
  background:rgba(0,0,0, calc(.72 - var(--bg-lift) * .42));
  transition:background .18s linear;
}
.app{
  position:relative;
  z-index:2;
  height:100dvh;
  height:100svh;
  padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom)) 10px;
  display:flex;
  align-items:stretch;
}
.grid{
  flex:1;
  display:grid;
  grid-template-columns:1fr;
  grid-template-rows:1fr 1fr;
  gap:10px;
  min-height:0;
}
.card{
  --accent:#ffc58a;
  position:relative;
  min-width:0;
  min-height:0;
  border:1px solid var(--line);
  border-radius:24px;
  background:linear-gradient(160deg,#151b28dd,#0d111add 58%,#0b0e16);
  box-shadow:0 18px 40px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.06);
  padding:10px 11px 6px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  isolation:isolate;
}
.card::before{
  content:"";
  position:absolute;
  inset:auto 12% 38% 12%;
  height:34%;
  background:var(--accent);
  opacity:.14;
  filter:blur(58px);
  z-index:-1;
  transition:opacity .25s;
}
.card.secondary{--accent:#ffbf79}
.card.off::before{opacity:.03}
.top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:0;
  position:relative;
  z-index:2;
}
.title-wrap{display:flex;align-items:flex-start;gap:0;min-width:0}
.title{min-width:0;padding-top:2px}
.name{
  font-size:12px;
  font-weight:700;
  letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sub{
  font-size:10px;
  color:var(--muted);
  margin-top:1px;
}
.toggle{
  width:42px;height:24px;border-radius:999px;border:1px solid #ffffff15;
  background:#2a3142;position:relative;flex:none;cursor:pointer;
  transition:.2s;
}
.toggle::before{
  content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;
  background:#8892a8;transition:.2s;
}
.toggle.on{
  background:var(--accent);
  box-shadow:0 0 16px color-mix(in srgb,var(--accent),transparent 68%);
}
.toggle.on::before{transform:translateX(18px);background:#161b26}
.dial-wrap{
  flex:1;
  min-height:0;
  display:grid;
  place-items:center;
  padding:0;
  container-type:size;
}
.dial{
  width:min(100%, 43svh, 370px);
  width:min(100cqw, 100cqh, 370px);
  min-width:0;
  aspect-ratio:1;
  position:relative;
  touch-action:none;
  outline:none;
}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.track{fill:none;stroke:#293041;stroke-width:10;stroke-linecap:round}
.progress{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 9px var(--accent))}
.thumb{fill:#fff;stroke:var(--accent);stroke-width:4.5;filter:drop-shadow(0 0 8px var(--accent))}
.inner{
  position:absolute;inset:19%;border-radius:50%;
  background:linear-gradient(150deg,#171d2b,#0d121b);
  border:1px solid #ffffff10;
  box-shadow:inset 0 8px 22px rgba(0,0,0,.34);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;
}
.value{font-size:clamp(26px,8.5vw,42px);font-weight:800;letter-spacing:-.08em;line-height:1}
.value span{font-size:.42em;vertical-align:super;color:#9aa4b8;margin-left:2px}
.caption{font-size:9px;font-weight:700;letter-spacing:.18em;color:#7f8aa1;margin-top:4px}
.temp-arc-head{display:flex;justify-content:center;align-items:center;gap:0;margin:0 0 4px;min-height:14px}
.temp-arc-head span,.temp-arc-head b{display:none}
.dial .temp-overlay{position:absolute;inset:0;pointer-events:none}
.dial .temp-hit{position:absolute;inset:0;touch-action:none;outline:none;background:transparent;border:0;padding:0;appearance:none;pointer-events:none}
.dial .temp-hit svg{width:100%;height:100%;display:block;overflow:visible}
.temp-track{fill:none;stroke:#293041;stroke-width:7;stroke-linecap:round;opacity:.7}
.temp-progress{display:none}
.temp-spectrum path{fill:none;stroke-width:8;stroke-linecap:butt}
.temp-thumb{fill:#ffd7aa;stroke:#fff;stroke-width:3;pointer-events:auto;cursor:grab;filter:drop-shadow(0 0 8px #ffd7aa)}
.bottom{flex:none}
.temp-head{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  margin-bottom:8px;
}
.temp-head span{font-size:9px;color:#7f8aa1;letter-spacing:.12em;font-weight:700}
.temp-head b{font-size:11px;font-weight:700}
.range{
  appearance:none;width:100%;margin:0;height:10px;border-radius:999px;
  background:linear-gradient(90deg,#ff955a,#ffd49c 34%,#fff1de 55%,#bbdfff 76%,#79b1ff);
  border:1px solid #ffffff2e;
}
.range::-webkit-slider-thumb{
  appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #171d29;
  box-shadow:0 0 0 2px #ffffffbb,0 4px 10px rgba(0,0,0,.5);
}
.range::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;background:#fff;border:4px solid #171d29;
  box-shadow:0 0 0 2px #ffffffbb,0 4px 10px rgba(0,0,0,.5);
}
.ends{display:flex;justify-content:space-between;margin-top:7px;color:#7f8aa1;font-size:9px}
.mini-note{display:none}
.card[data-name="main"] .dial-wrap{padding:0;margin-top:-20px}.card[data-name="main"] .dial{width:min(100%, 43svh, 370px);width:min(100cqw, 100cqh, 370px)}
.card.secondary .dial-wrap{margin-top:-14px}
.card.off .dial-wrap,.card.off .bottom{opacity:.34;filter:grayscale(1);pointer-events:none}
@media (max-width:380px){
  .card{padding:10px 10px 8px;border-radius:21px}
  .name{font-size:11px}
  .sub{font-size:9px}
  .temp-head span,.ends,.caption{font-size:8px}
  .temp-arc-head span{font-size:7px}
  .temp-arc-head b{font-size:10px}
}
@media (max-height:650px){.card{padding:7px 10px 4px}.top{margin-bottom:0}.grid{gap:7px}.dial-wrap{margin-top:-10px}.card[data-name="main"] .dial-wrap{margin-top:-14px}}
</style>
</head>
<body>
<div class="ambient ambient-main"></div>
<div class="ambient ambient-accent"></div>
<div class="darkness"></div>
<div class="app">
  <section class="grid">
    <article class="card" data-name="main" data-value="72" data-temp="3800">
      <div class="top">
        <div class="title-wrap">
          <div class="title">
            <div class="name">Гостинная</div>
            <div class="sub">Вкл · <span class="status-value">72%</span></div>
          </div>
        </div>
        <button class="toggle on" type="button" aria-label="Переключить основной свет" aria-pressed="true"></button>
      </div>

      <div class="dial-wrap">
        

        <div class="dial main-dial" role="slider" tabindex="0" aria-label="Яркость основного света" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72">
          <svg viewBox="0 0 240 240" aria-hidden="true">
            <path class="track"></path>
            <path class="progress"></path>
            <circle class="thumb" r="7"></circle>
          </svg>

          <div class="temp-hit" role="slider" tabindex="0" aria-label="Оттенок света в гостинной" aria-valuemin="2700" aria-valuemax="6500" aria-valuenow="3800">
            <svg viewBox="0 0 240 240" aria-hidden="true">
              <defs>
                <linearGradient id="tempGrad" x1="12%" y1="50%" x2="88%" y2="50%">
                  <stop offset="0%" stop-color="#ff955a"></stop>
                  <stop offset="45%" stop-color="#ffe1bf"></stop>
                  <stop offset="100%" stop-color="#86bcff"></stop>
                </linearGradient>
              </defs>
              <path class="temp-track"></path>
              <g class="temp-spectrum"></g>
              <path class="temp-progress"></path>
              <circle class="temp-thumb" r="7"></circle>
            </svg>
          </div>

          <div class="inner">
            <div class="value">72<span>%</span></div>
            <div class="caption">ЯРКОСТЬ</div>
          </div>
        </div>
      </div>


    </article>

    <article class="card secondary" data-name="accent" data-value="45">
      <div class="top">
        <div class="title-wrap">
          <div class="title">
            <div class="name">Спальня</div>
            <div class="sub">Вкл · <span class="status-value">45%</span></div>
          </div>
        </div>
        <button class="toggle on" type="button" aria-label="Переключить дополнительный свет" aria-pressed="true"></button>
      </div>

      <div class="dial-wrap">
        <div class="dial" role="slider" tabindex="0" aria-label="Яркость дополнительного света" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45">
          <svg viewBox="0 0 240 240" aria-hidden="true">
            <path class="track"></path>
            <path class="progress"></path>
            <circle class="thumb" r="7"></circle>
          </svg>
          <div class="inner">
            <div class="value">45<span>%</span></div>
            <div class="caption">ЯРКОСТЬ</div>
          </div>
        </div>
      </div>


    </article>
  </section>
</div>

<script>
(() => {
  'use strict';

  const CENTER = 120;
  const RADIUS = 90;
  const START = 135;
  const SPAN = 270;
  const TEMP_CENTER_X = 120;
  const TEMP_CENTER_Y = 120;
  const TEMP_RADIUS = 121;
  const TEMP_START = 228;
  const TEMP_SPAN = 84;
  const TEMP_MIN = 2700;
  const TEMP_MAX = 6500;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const point = deg => ({
    x: CENTER + RADIUS * Math.sin(deg * Math.PI / 180),
    y: CENTER - RADIUS * Math.cos(deg * Math.PI / 180)
  });

  const arcPath = (a, b) => {
    const p = point(a);
    const q = point(b);
    return `M ${p.x} ${p.y} A ${RADIUS} ${RADIUS} 0 ${b - a > 180 ? 1 : 0} 1 ${q.x} ${q.y}`;
  };

  const tempPoint = deg => ({
    x: TEMP_CENTER_X + TEMP_RADIUS * Math.sin(deg * Math.PI / 180),
    y: TEMP_CENTER_Y - TEMP_RADIUS * Math.cos(deg * Math.PI / 180)
  });

  const tempArcPath = (a, b) => {
    const p = tempPoint(a);
    const q = tempPoint(b);
    return `M ${p.x} ${p.y} A ${TEMP_RADIUS} ${TEMP_RADIUS} 0 ${b - a > 180 ? 1 : 0} 1 ${q.x} ${q.y}`;
  };

  for (const card of document.querySelectorAll('.card')) {
    const dial = card.querySelector('.dial');
    const track = dial.querySelector('.track');
    const progress = dial.querySelector('.progress');
    const thumb = dial.querySelector('.thumb');
    const valueEl = card.querySelector('.value');
    const statusValue = card.querySelector('.status-value');
    const toggle = card.querySelector('.toggle');
    const range = card.querySelector('.range');
    const kelvin = card.querySelector('.kelvin');
    const tempArc = card.querySelector('.temp-hit');
    const tempTrack = card.querySelector('.temp-track');
    const tempProgress = card.querySelector('.temp-progress');
    const tempThumb = card.querySelector('.temp-thumb');
    const tempSpectrum = card.querySelector('.temp-spectrum');

    let value = clamp(Number(card.dataset.value) || 0, 0, 100);
    let on = true;
    let dragging = false;
    let tempK = clamp(Number(card.dataset.temp) || 3800, TEMP_MIN, TEMP_MAX);

    track.setAttribute('d', arcPath(START, START + SPAN));
    if (tempTrack) tempTrack.setAttribute('d', tempArcPath(TEMP_START, TEMP_START + TEMP_SPAN));

    const render = () => {
      const angle = START + SPAN * value / 100;
      const p = point(angle);
      progress.setAttribute('d', value === 0 ? `M ${point(START).x} ${point(START).y}` : arcPath(START, angle));
      thumb.setAttribute('cx', p.x);
      thumb.setAttribute('cy', p.y);
      valueEl.innerHTML = `${value}<span>%</span>`;
      statusValue.textContent = `${value}%`;
      dial.setAttribute('aria-valuenow', String(value));
      dial.setAttribute('aria-disabled', String(!on));

      const level = (on ? value : 0) / 100;
      if (card.dataset.name === 'main') {
        document.body.style.setProperty('--main-level', String(Math.max(.06, level)));
        document.body.style.setProperty('--bg-lift', String(level));
      } else {
        document.body.style.setProperty('--accent-level', String(Math.max(.04, level)));
      }
    };

    const pointerToValue = (e) => {
      const r = dial.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width * 240 - CENTER;
      const y = (e.clientY - r.top) / r.height * 240 - CENTER;
      const angle = (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360;
      const delta = (angle - START + 360) % 360;
      if (delta > SPAN) {
        return ((360 - delta) < (delta - SPAN)) ? 0 : 100;
      }
      return clamp(Math.round(delta / SPAN * 100), 0, 100);
    };

    // Сдвиг яркости разрешён только после захвата белого маркера.
    let activePointerId = null;
    const isOnThumb = (e) => {
      const r = dial.getBoundingClientRect();
      const p = point(START + SPAN * value / 100);
      const thumbX = r.left + (p.x / 240) * r.width;
      const thumbY = r.top + (p.y / 240) * r.height;
      // Удобная область касания для пальца вокруг видимого маркера.
      const tolerance = e.pointerType === 'touch' ? 25 : 15;
      return Math.hypot(e.clientX - thumbX, e.clientY - thumbY) <= tolerance;
    };

    dial.addEventListener('pointerdown', (e) => {
      if (!on || dragging || !isOnThumb(e)) return;
      e.preventDefault();
      dragging = true;
      activePointerId = e.pointerId;
      dial.setPointerCapture(e.pointerId);
      // Не меняем значение при касании: только когда пользователь ведёт маркер.
    });

    dial.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== activePointerId) return;
      e.preventDefault();
      render(value = pointerToValue(e));
    });

    const stopDrag = (e) => {
      if (e.pointerId !== activePointerId) return;
      dragging = false;
      activePointerId = null;
      if (dial.hasPointerCapture(e.pointerId)) dial.releasePointerCapture(e.pointerId);
    };
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      dial.addEventListener(type, stopDrag);
    }

    dial.addEventListener('keydown', (e) => {
      if (!on) return;
      let next = value;
      let handled = true;
      switch (e.key) {
        case 'ArrowUp':
        case 'ArrowRight': next += 1; break;
        case 'ArrowDown':
        case 'ArrowLeft': next -= 1; break;
        case 'PageUp': next += 10; break;
        case 'PageDown': next -= 10; break;
        case 'Home': next = 0; break;
        case 'End': next = 100; break;
        default: handled = false;
      }
      if (!handled) return;
      e.preventDefault();
      render(value = clamp(next, 0, 100));
    });

    toggle.addEventListener('click', () => {
      on = !on;
      toggle.classList.toggle('on', on);
      toggle.setAttribute('aria-pressed', String(on));
      card.classList.toggle('off', !on);
      if (range) range.disabled = !on;
      if (tempArc) tempArc.setAttribute('aria-disabled', String(!on));
      render();
    });

    if (tempArc && tempTrack && tempProgress && tempThumb) {
      const mix = (a, b, t) => {
        const x = parseInt(a.slice(1), 16);
        const y = parseInt(b.slice(1), 16);
        const c = [16, 8, 0].map(s => Math.round(((x >> s) & 255) * (1 - t) + ((y >> s) & 255) * t));
        return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
      };

      const colorForKelvin = k => k < 4000
        ? mix('#ff9855', '#ffe4bd', (k - 2700) / 1300)
        : mix('#ffe4bd', '#8dbfff', (k - 4000) / 2500);

      // A real color spectrum all along the curved track, not a flat-colored progress line.
      if (tempSpectrum) {
        const NS = 'http://www.w3.org/2000/svg';
        const segments = 64;
        for (let i = 0; i < segments; i++) {
          const a = TEMP_START + TEMP_SPAN * i / segments;
          const b = TEMP_START + TEMP_SPAN * (i + 1) / segments + (i === segments - 1 ? 0 : .12);
          const path = document.createElementNS(NS, 'path');
          path.setAttribute('d', tempArcPath(a, b));
          path.setAttribute('stroke', colorForKelvin(TEMP_MIN + (TEMP_MAX - TEMP_MIN) * (i + .5) / segments));
          tempSpectrum.appendChild(path);
        }
        // Round only the two endpoints. The middle stays smooth, without lumps at joins.
        for (const [a, k] of [[TEMP_START, TEMP_MIN], [TEMP_START + TEMP_SPAN, TEMP_MAX]]) {
          const p = tempPoint(a);
          const cap = document.createElementNS(NS, 'circle');
          cap.setAttribute('cx', p.x);
          cap.setAttribute('cy', p.y);
          cap.setAttribute('r', '4');
          cap.setAttribute('fill', colorForKelvin(k));
          cap.setAttribute('pointer-events', 'none');
          tempSpectrum.appendChild(cap);
        }
      }

      const renderTemp = () => {
        const norm = (tempK - TEMP_MIN) / (TEMP_MAX - TEMP_MIN);
        const angle = TEMP_START + TEMP_SPAN * norm;
        const p = tempPoint(angle);
        tempProgress.setAttribute('d', norm === 0 ? `M ${tempPoint(TEMP_START).x} ${tempPoint(TEMP_START).y}` : tempArcPath(TEMP_START, angle));
        tempThumb.setAttribute('cx', p.x);
        tempThumb.setAttribute('cy', p.y);
        tempArc.setAttribute('aria-valuenow', String(tempK));


        const color = colorForKelvin(tempK);
        card.style.setProperty('--accent', color);
        tempThumb.style.fill = color;
        tempThumb.style.filter = `drop-shadow(0 0 9px ${color})`;
        if (card.dataset.name === 'main') {
          document.querySelector('.ambient-main').style.background = `
            radial-gradient(circle at 24% 18%, ${color}ee 0, ${color}77 18%, transparent 42%),
            radial-gradient(circle at 50% 45%, rgba(255,245,232,.24) 0, rgba(255,245,232,0) 52%)`;
        }
      };

      const tempPointerToValue = (e) => {
        const r = tempArc.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width * 240 - TEMP_CENTER_X;
        const y = (e.clientY - r.top) / r.height * 240 - TEMP_CENTER_Y;
        const angle = (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360;
        let extended = angle < 180 ? angle + 360 : angle;
        extended = clamp(extended, TEMP_START, TEMP_START + TEMP_SPAN);
        const norm = (extended - TEMP_START) / TEMP_SPAN;
        return Math.round((TEMP_MIN + norm * (TEMP_MAX - TEMP_MIN)) / 100) * 100;
      };

      let tempDragging = false;
      let tempPointerId = null;
      const isOnTempThumb = (e) => {
        const r = tempArc.getBoundingClientRect();
        const norm = (tempK - TEMP_MIN) / (TEMP_MAX - TEMP_MIN);
        const p = tempPoint(TEMP_START + TEMP_SPAN * norm);
        const thumbX = r.left + (p.x / 240) * r.width;
        const thumbY = r.top + (p.y / 240) * r.height;
        const tolerance = e.pointerType === 'touch' ? 24 : 14;
        return Math.hypot(e.clientX - thumbX, e.clientY - thumbY) <= tolerance;
      };

      tempArc.addEventListener('pointerdown', (e) => {
        if (!on || tempDragging || !isOnTempThumb(e)) return;
        e.preventDefault();
        tempDragging = true;
        tempPointerId = e.pointerId;
        tempArc.setPointerCapture(e.pointerId);
      });

      tempArc.addEventListener('pointermove', (e) => {
        if (!tempDragging || e.pointerId !== tempPointerId) return;
        e.preventDefault();
        tempK = clamp(tempPointerToValue(e), TEMP_MIN, TEMP_MAX);
        renderTemp();
      });

      const stopTempDrag = (e) => {
        if (e.pointerId !== tempPointerId) return;
        tempDragging = false;
        tempPointerId = null;
        if (tempArc.hasPointerCapture(e.pointerId)) tempArc.releasePointerCapture(e.pointerId);
      };
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        tempArc.addEventListener(type, stopTempDrag);
      }

      tempArc.addEventListener('keydown', (e) => {
        if (!on) return;
        let next = tempK;
        let handled = true;
        switch (e.key) {
          case 'ArrowLeft':
          case 'ArrowDown': next -= 100; break;
          case 'ArrowRight':
          case 'ArrowUp': next += 100; break;
          case 'Home': next = TEMP_MIN; break;
          case 'End': next = TEMP_MAX; break;
          default: handled = false;
        }
        if (!handled) return;
        e.preventDefault();
        tempK = clamp(next, TEMP_MIN, TEMP_MAX);
        renderTemp();
      });

      renderTemp();
    }

    render();
  }
})();
</script>
